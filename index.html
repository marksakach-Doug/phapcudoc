    { id: 'XXVI', title: 'XXVI. Bà-la-môn', range: 'câu 383–423' }
  ];

  var VERSES = [
      { c: 'I', n: 1, vi: 'Ý dẫn đầu các pháp,\nÝ làm chủ, ý tạo;\nNếu với ý ô nhiễm,\nNói lên hay hành động,\nKhổ não bước theo sau,\nNhư xe, chân vật kéo.', en: 'All that we are is the result of what we have thought: it is founded on our thoughts, it is made up of our thoughts. If a man speaks or acts with an evil thought, pain follows him, as the wheel follows the foot of the ox that draws the carriage.' },
  { c: 'I', n: 2, vi: 'Ý dẫn đầu các pháp,\nÝ làm chủ, ý tạo,\nNếu với ý thanh tịnh,\nNói lên hay hành động,\nAn lạc bước theo sau,\nNhư bóng, không rời hình.', en: 'All that we are is the result of what we have thought: it is founded on our thoughts, it is made up of our thoughts. If a man speaks or acts with a pure thought, happiness follows him, like a shadow that never leaves him.' },
  { c: 'I', n: 3, vi: 'Nó mắng tôi, đánh tôi,\nNó thắng tôi, cướp tôi\nAi ôm hiềm hận ấy,\nHận thù không thể nguôi.', en: '"He abused me, he beat me, he defeated me, he robbed me,"--in those who harbour such thoughts hatred will never cease.' },
  { c: 'I', n: 4, vi: 'Nó mắng tôi, đánh tôi,\nNó thắng tôi, cướp tôi,\nKhông ôm hiềm hận ấy,\nHận thù được tự nguôi.', en: '"He abused me, he beat me, he defeated me, he robbed me,"--in those who do not harbour such thoughts hatred will cease.' },
  { c: 'I', n: 5, vi: 'Với hận diệt hận thù,\nĐời này không có được.\nKhông hận diệt hận thù,\nLà định luật ngàn thu.', en: 'For hatred does not cease by hatred at any time: hatred ceases by love, this is an old rule.' },
  { c: 'I', n: 6, vi: 'Và người khác không biết,\nChúng ta đây bị hại.\nChỗ ấy, ai biết được\nTranh luận được lắng êm.', en: 'The world does not know that we must all come to an end here;--but those who know it, their quarrels cease at once.' },
  { c: 'I', n: 7, vi: 'Ai sống nhìn tịnh tướng,\nKhông hộ trì các căn,\nĂn uống thiếu tiết độ,\nBiếng nhác, chẳng tinh cần.\nMa uy hiếp kẻ ấy,\nNhư cây yếu trước gió.', en: 'He who lives looking for pleasures only, his senses uncontrolled, immoderate in his food, idle, and weak, Mara (the tempter) will certainly overthrow him, as the wind throws down a weak tree.' },
  { c: 'I', n: 8, vi: 'Ai sống quán bất tịnh,\nKhéo hộ trì các căn,\nĂn uống có tiết độ,\nCó lòng tin, tinh cần,\nMa không uy hiếp được,\nNhư núi đá, trước gió. ', en: 'He who lives without looking for pleasures, his senses well controlled, moderate in his food, faithful and strong, him Mara will certainly not overthrow, any more than the wind throws down a rocky mountain.' },
  { c: 'I', n: 9, vi: 'Ai mặc áo cà-sa,\nTâm chưa rời uế trược,\nKhông tự chế, không thực,\nKhông xứng áo cà-sa.', en: 'He who wishes to put on the yellow dress without having cleansed himself from sin, who disregards temperance and truth, is unworthy of the yellow dress.' },
  { c: 'I', n: 10, vi: 'Ai rời bỏ uế trược,\nGiới luật khéo nghiêm trì,\nTự chế, sống chơn thực,\nThật xứng áo cà sa.', en: 'But he who has cleansed himself from sin, is well grounded in all virtues, and regards also temperance and truth, he is indeed worthy of the yellow dress.' },
  { c: 'I', n: 11, vi: 'Không chân, tưởng chân thật,\nChân thật, thấy không chân:\nHọ không đạt chân thật,\nDo tà tư, tà hạnh.', en: 'They who imagine truth in untruth, and see untruth in truth, never arrive at truth, but follow vain desires.' },
  { c: 'I', n: 12, vi: 'Chân thật, biết chân thật,\nKhông chân, biết không chân.\nHọ đạt được chân thật,\nDo chánh tư, chánh hạnh.', en: 'They who know truth in truth, and untruth in untruth, arrive at truth, and follow true desires.' },
  { c: 'I', n: 13, vi: 'Như ngôi nhà vụng lợp,\nMưa liền xâm nhập vào.\nCũng vậy tâm không tu,\nTham dục liền xâm nhập.', en: 'As rain breaks through an ill-thatched house, passion will break through an unreflecting mind.' },
  { c: 'I', n: 14, vi: 'Như ngôi nhà khéo lợp,\nMưa không xâm nhập vào, \nCũng vậy tâm khéo tu,\nTham dục không xâm nhập.', en: 'As rain does not break through a well-thatched house, passion will not break through a well-reflecting mind.' },
  { c: 'I', n: 15, vi: 'Nay sầu, đời sau sầu,\nKẻ ác, hai đời sầu;\nNó sầu, nó ưu não,\nThấy nghiệp uế mình làm.', en: 'The evil-doer mourns in this world, and he mourns in the next; he mourns in both. He mourns and suffers when he sees the evil of his own work.' },
  { c: 'I', n: 16, vi: 'Nay vui, đời sau vui,\nLàm phước, hai đời vui.\nNgười ấy vui, an vui,\nThấy nghiệp tịnh mình làm.', en: 'The virtuous man delights in this world, and he delights in the next; he delights in both. He delights and rejoices, when he sees the purity of his own work.' },
  { c: 'I', n: 17, vi: 'Nay than, đời sau than,\nKẻ ác, hai đời than,\nThan rằng : "Ta làm ác"\nĐọa cõi dữ, than hơn”.', en: 'The evil-doer suffers in this world, and he suffers in the next; he suffers in both. He suffers when he thinks of the evil he has done; he suffers more when going on the evil path.' },
  { c: 'I', n: 18, vi: 'Nay sướng, đời sau sướng,\nLàm phước, hai đời sướng.\nNó sướng : "Ta làm thiện",\nSanh cõi lành, sướng hơn”.', en: 'The virtuous man is happy in this world, and he is happy in the next; he is happy in both. He is happy when he thinks of the good he has done; he is still more happy when going on the good path.' },
  { c: 'I', n: 19, vi: 'Nếu người nói nhiều kinh,\nKhông hành trì, phóng dật;\nNhư kẻ chăn bò người,\nKhông phần Sa môn hạnh. ', en: 'The thoughtless man, even if he can recite a large portion (of the law), but is not a doer of it, has no share in the priesthood, but is like a cowherd counting the cows of others.' },
  { c: 'I', n: 20, vi: 'Dầu nói ít kinh điển,\nNhưng hành pháp, tùy pháp,\nTừ bỏ tham, sân, si,\nTĩnh giác, tâm giải thoát,\nKhông chấp thủ hai đời,\nDự phần Sa môn hạnh.', en: 'The follower of the law, even if he can recite only a small portion (of the law), but, having forsaken passion and hatred and foolishness, possesses true knowledge and serenity of mind, he, caring for nothing in this world or that to come, has indeed a share in the priesthood.' },
  { c: 'II', n: 21, vi: 'Không phóng dật, đường sống,\nPhóng dật là đường chết.\nKhông phóng dật, không chết,\nPhóng dật như chết rồi.', en: 'Earnestness is the path of immortality (Nirvana), thoughtlessness the path of death. Those who are in earnest do not die, those who are thoughtless are as if dead already.' },
  { c: 'II', n: 22, vi: 'Biết rõ sai biệt ấy,\nNgười trí không phóng dật,\nHoan hỷ, không phóng dật,\nAn vui hạnh bậc Thánh.', en: 'Those who are advanced in earnestness, having understood this clearly, delight in earnestness, and rejoice in the knowledge of the Ariyas (the elect).' },
  { c: 'II', n: 23, vi: 'Người hằng tu thiền định,\nThường kiên trì tinh tấn.\nBậc trí hưởng Niết Bàn,\nÁch an tịnh vô thượng.', en: 'These wise people, meditative, steady, always possessed of strong powers, attain to Nirvana, the highest happiness.' },
  { c: 'II', n: 24, vi: 'Nỗ lực, giữ chánh niệm,\nTịnh hạnh, hành thận trọng\nTự điều, sống theo pháp, \nAi sống không phóng dật,\nTiếng lành ngày tăng trưởng.', en: 'If an earnest person has roused himself, if he is not forgetful, if his deeds are pure, if he acts with consideration, if he restrains himself, and lives according to law,--then his glory will increase.' },
  { c: 'II', n: 25, vi: 'Nỗ lực, không phóng dật,\nTự điều, khéo chế ngự.\nBậc trí xây hòn đảo,\nNước lụt khó ngập tràn.', en: 'By rousing himself, by earnestness, by restraint and control, the wise man may make for himself an island which no flood can overwhelm.' },
  { c: 'II', n: 26, vi: 'Họ ngu si thiểu trí,\nChuyên sống đời phóng dật.\nNgười trí, không phóng dật,\nNhư giữ tài sản quý.', en: 'Fools follow after vanity, men of evil wisdom. The wise man keeps earnestness as his best jewel.' },
  { c: 'II', n: 27, vi: 'Chớ sống đời phóng dật,\nChớ mê say dục lạc.\nKhông phóng dật, thiền định,\nĐạt được an lạc lớn.', en: 'Follow not after vanity, nor after the enjoyment of love and lust! He who is earnest and meditative, obtains ample joy.' },
  { c: 'II', n: 28, vi: 'Người trí dẹp phóng dật,\nVới hạnh không phóng dật,\nLeo lầu cao trí tuệ,\nKhông sầu, nhìn khổ sầu,\nBậc trí đứng núi cao,\nNhìn kẻ ngu, đất bằng.', en: 'When the learned man drives away vanity by earnestness, he, the wise, climbing the terraced heights of wisdom, looks down upon the fools, serene he looks upon the toiling crowd, as one that stands on a mountain looks down upon them that stand upon the plain.' },
  { c: 'II', n: 29, vi: 'Tinh cần giữa phóng dật,\nTỉnh thức giữa quần mê.\nNgười trí như ngựa phi,\nBỏ sau con ngựa hèn. ', en: 'Earnest among the thoughtless, awake among the sleepers, the wise man advances like a racer, leaving behind the hack.' },
  { c: 'II', n: 30, vi: 'Đế Thích không phóng dật,\nĐạt ngôi vị Thiên chủ.\nKhông phóng dật, được khen;\nPhóng dật, thường bị trách.', en: 'By earnestness did Maghavan (Indra) rise to the lordship of the gods. People praise earnestness; thoughtlessness is always blamed.' },
  { c: 'II', n: 31, vi: 'Vui thích không phóng dật,\nTỷ kheo sợ phóng dật,\nBước tới như lửa hừng,\nThiêu kiết sử lớn nhỏ.', en: 'A Bhikshu (mendicant) who delights in earnestness, who looks with fear on thoughtlessness, moves about like fire, burning all his fetters, small or large.' },
  { c: 'II', n: 32, vi: 'Vui thích không phóng dật,\nTỷ kheo sợ phóng dật,\nKhông thể bị thối đọa,\nNhất định gần Niết Bàn.', en: 'A Bhikshu (mendicant) who delights in reflection, who looks with fear on thoughtlessness, cannot fall away (from his perfect state)--he is close upon Nirvana.' },
  { c: 'III', n: 33, vi: 'Tâm hoảng hốt giao động,\nKhó hộ trì, khó nhiếp,\nNgười trí làm tâm thẳng,\nNhư thợ tên, làm tên.', en: 'As a fletcher makes straight his arrow, a wise man makes straight his trembling and unsteady thought, which is difficult to guard, difficult to hold back.' },
  { c: 'III', n: 34, vi: 'Như cá quăng lên bờ,\nVất ra ngoài thủy giới;\nTâm này vũng vẫy mạnh,\nHãy đoạn thế lực Ma', en: 'As a fish taken from his watery home and thrown on dry ground, our thought trembles all over in order to escape the dominion of Mara (the tempter).' },
  { c: 'III', n: 35, vi: 'Khó nắm giữ, khinh động,\nTheo các dục quay cuồng.\nLành thay, điều phục tâm;\nTâm điều, an lạc đến.', en: 'It is good to tame the mind, which is difficult to hold in and flighty, rushing wherever it listeth; a tamed mind brings happiness.' },
  { c: 'III', n: 36, vi: 'Tâm khó thấy, tế nhị,\nTheo các dục quay cuồng.\nNgười trí phòng hộ tâm,\nTâm hộ, an lạc đến.', en: 'Let the wise man guard his thoughts, for they are difficult to perceive, very artful, and they rush wherever they list: thoughts well guarded bring happiness.' },
  { c: 'III', n: 37, vi: 'Chạy xa, sống một mình,\nKhông thân, ẩn hang sâu\nAi điều phục được tâm,\nThoát khỏi Ma trói buộc', en: 'Those who bridle their mind which travels far, moves about alone, is without a body, and hides in the chamber (of the heart), will be free from the bonds of Mara (the tempter).' },
  { c: 'III', n: 38, vi: 'Ai tâm không an trú,\nKhông biết chân diệu pháp,\nTịnh tín bị rúng động,\nTrí tuệ không viên thành.', en: 'If a man\'s thoughts are unsteady, if he does not know the true law, if his peace of mind is troubled, his knowledge will never be perfect.' },
  { c: 'III', n: 39, vi: 'Tâm không đầy tràn dục,\nTâm không hận công phá,\nĐoạn tuyệt mọi thiện ác,\nKẻ tỉnh không sợ hãi,', en: 'If a man\'s thoughts are not dissipated, if his mind is not perplexed, if he has ceased to think of good or evil, then there is no fear for him while he is watchful.' },
  { c: 'III', n: 40, vi: 'Biết thân như đồ gốm,\nTrú tâm như thành trì, \nChống ma với gươm trí;\nGiữ chiến thắng không tham', en: 'Knowing that this body is (fragile) like a jar, and making this thought firm like a fortress, one should attack Mara (the tempter) with the weapon of knowledge, one should watch him when conquered, and should never rest.' },
  { c: 'III', n: 41, vi: 'Không bao lâu thân này,\nSẽ nằm dài trên đất,\nBị vất bỏ, vô thức,\nNhư khúc cây vô dụng.', en: 'Before long, alas! this body will lie on the earth, despised, without understanding, like a useless log.' },
  { c: 'III', n: 42, vi: 'Kẻ thù hại kẻ thù,\nOan gia hại oan gia,\nKhông bằng tâm hướng tà,\nGây ác cho tự thân.', en: 'Whatever a hater may do to a hater, or an enemy to an enemy, a wrongly-directed mind will do us greater mischief.' },
  { c: 'III', n: 43, vi: 'Điều mẹ, cha, bà con,\nKhông có thể làm được,\nTâm hướng chánh làm được,\nLàm được tốt đẹp hơn.', en: 'Not a mother, not a father will do so much, nor any other relative; a well-directed mind will do us greater service.' },
  { c: 'IV', n: 44, vi: 'Ai chinh phục đất này,\nDạ-ma thiên giới này,\nAi khéo giảng Pháp cú,\nNhư người khéo hái hoa .', en: 'Who shall overcome this earth, and the world of Yama (the lord of the departed), and the world of the gods? Who shall find out the plainly shown path of virtue, as a clever man finds out the (right) flower?' },
  { c: 'IV', n: 45, vi: 'Hữu học chinh phục đất,\nDạ-ma thiên giới này,\nHữu học giảng Pháp cú,\nNhư người khéo hái hoa.', en: 'The disciple will overcome the earth, and the world of Yama, and the world of the gods. The disciple will find out the plainly shown path of virtue, as a clever man finds out the (right) flower.' },
  { c: 'IV', n: 46, vi: 'Biết thân như bọt nước,\nNgộ thân là như huyễn,\nBẻ tên hoa của Ma,\nVượt tầm mắt Thần chết.', en: 'He who knows that this body is like froth, and has learnt that it is as unsubstantial as a mirage, will break the flower-pointed arrow of Mara, and never see the king of death.' },
  { c: 'IV', n: 47, vi: 'Người nhặt các loại hoa,\nÝ đắm say, tham nhiễm,\nBị Thần chết mang đi,\nNhư lụt trôi làng ngủ.', en: 'Death carries off a man who is gathering flowers and whose mind is distracted, as a flood carries off a sleeping village.' },
  { c: 'IV', n: 48, vi: 'Người nhặt các loại hoa,\nÝ đắm say tham nhiễm,\nCác dục chưa thỏa mãn,\nĐã bị chết chinh phục.', en: 'Death subdues a man who is gathering flowers, and whose mind is distracted, before he is satiated in his pleasures.' },
  { c: 'IV', n: 49, vi: 'Như ong đến với hoa,\nKhông hại sắc và hương,\nChe chở hoa, lấy nhụy.\nBậc Thánh đi vào làng.', en: 'As the bee collects nectar and departs without injuring the flower, or its colour or scent, so let a sage dwell in his village.' },
  { c: 'IV', n: 50, vi: 'Không nên nhìn lỗi người,\nNgười làm hay không làm.\nNên nhìn tự chính mình.\nCó làm hay không làm.', en: 'Not the perversities of others, not their sins of commission or omission, but his own misdeeds and negligences should a sage take notice of.' },
  { c: 'IV', n: 51, vi: 'Như bông hoa tươi đẹp,\nCó sắc nhưng không hương.\nCũng vậy, lời khéo nói,\nKhông làm, không kết quả.', en: 'Like a beautiful flower, full of colour, but without scent, are the fine but fruitless words of him who does not act accordingly.' },
  { c: 'IV', n: 52, vi: 'Như bông hoa tươi đẹp,\nCó sắc lại thêm hương;\nCũng vậy, lời khéo nói,\nCó làm, có kết quả.', en: 'But, like a beautiful flower, full of colour and full of scent, are the fine and fruitful words of him who acts accordingly.' },
  { c: 'IV', n: 53, vi: 'Như từ một đống hoa,\nNhiều tràng hoa được làm.\nCũng vậy, thân sanh tử,\nLàm được nhiều việc lành.', en: 'As many kinds of wreaths can be made from a heap of flowers, so many good things may be achieved by a mortal when once he is born.' },
  { c: 'IV', n: 54, vi: 'Hương các loại hoa thơm\nKhông ngược bay chiều gió\nNhưng hương người đức hạnh\nNgược gió khắp tung bay\nChỉ có bậc chân nhân\nTỏa khắp mọi phương trời.', en: 'The scent of flowers does not travel against the wind, nor (that of) sandal-wood, or of Tagara and Mallika flowers; but the odour of good people travels even against the wind; a good man pervades every place.' },
  { c: 'IV', n: 55, vi: 'Hoa chiên đàn, già la,\nHoa sen, hoa vũ quý,\nGiữa những hương hoa ấy,\nGiới hương là vô thượng. ', en: 'Sandal-wood or Tagara, a lotus-flower, or a Vassiki, among these sorts of perfumes, the perfume of virtue is unsurpassed.' },
  { c: 'IV', n: 56, vi: 'Ít giá trị hương này,\nHương già la, chiên đàn;\nChỉ hương người đức hạnh,\nTối thượng tỏa Thiên giới.', en: 'Mean is the scent that comes from Tagara and sandal-wood;--the perfume of those who possess virtue rises up to the gods as the highest.' },
  { c: 'IV', n: 57, vi: 'Những ai có giới hạnh,\nAn trú không phóng dật,\nChánh trí, chơn giải thoát,\nÁc ma không thấy đường.', en: 'Of the people who possess these virtues, who live without thoughtlessness, and who are emancipated through true knowledge, Mara, the tempter, never finds the way.' },
  { c: 'IV', n: 58, vi: 'Như giữa đống rác nhớp,\nQuăng bỏ trên đường lớn,\nChỗ ấy hoa sen nở,\nThơm sạch, đẹp ý người.', en: 'As on a heap of rubbish cast upon the highway the lily will grow full of sweet perfume and delight, thus the disciple of the truly enlightened Buddha shines forth by his knowledge among those who are like rubbish, among the people that walk in darkness.' },
  { c: 'IV', n: 59, vi: 'Cũng vậy giữa quần sanh,\nUế nhiễm, mù, phàm tục,\nĐệ tử bậc Chánh Giác,\nSáng ngời với Tuệ Trí.', en: 'As on a heap of rubbish cast upon the highway the lily will grow full of sweet perfume and delight, thus the disciple of the truly enlightened Buddha shines forth by his knowledge among those who are like rubbish, among the people that walk in darkness.' },
  { c: 'V', n: 60, vi: 'Đêm dài cho kẻ thức,\nĐường dài cho kẻ mệt,\nLuân hồi dài, kẻ ngu,\nKhông biết chơn diệu pháp.', en: 'Long is the night to him who is awake; long is a mile to him who is tired; long is life to the foolish who do not know the true law.' },
  { c: 'V', n: 61, vi: 'Tìm không được bạn đường,\nHơn mình hay bằng mình,\nThà quyết sống một mình,\nKhông bè bạn kẻ ngu.', en: 'If a traveller does not meet with one who is his better, or his equal, let him firmly keep to his solitary journey; there is no companionship with a fool.' },
  { c: 'V', n: 62, vi: 'Con tôi, tài sản tôi,\nNgười ngu sanh ưu não,\nTự ta, ta không có,\nCon đâu, tài sản đâu.', en: '"These sons belong to me, and this wealth belongs to me," with such thoughts a fool is tormented. He himself does not belong to himself; how much less sons and wealth?' },
  { c: 'V', n: 63, vi: 'Người ngu nghĩ mình ngu,\nNhờ vậy thành có trí.\nNgười ngu tưởng có trí,\nThật xứng gọi chí ngu.', en: 'The fool who knows his foolishness, is wise at least so far. But a fool who thinks himself wise, he is called a fool indeed.' },
  { c: 'V', n: 64, vi: 'Người ngu, dầu trọn đời,\nThân cận người có trí,\nKhông biết được Chánh pháp,\nNhư muỗng với vị canh.', en: 'If a fool be associated with a wise man even all his life, he will perceive the truth as little as a spoon perceives the taste of soup.' },
  { c: 'V', n: 65, vi: 'Người trí, dầu một khắc,\nThân cận người có trí,\nBiết ngay chân diệu pháp,\nNhư lưỡi với vị canh.', en: 'If an intelligent man be associated for one minute only with a wise man, he will soon perceive the truth, as the tongue perceives the taste of soup.' },
  { c: 'V', n: 66, vi: 'Người ngu si thiếu trí,\nTự ngã thành kẻ thù. \nLàm các nghiệp không thiện,\nPhải chịu quả đắng cay.', en: 'Fools of little understanding have themselves for their greatest enemies, for they do evil deeds which must bear bitter fruits.' },
  { c: 'V', n: 67, vi: 'Nghiệp làm không chánh thiện,\nLàm rồi sanh ăn năn,\nMặt nhuốm lệ, khóc than,\nLãnh chịu quả dị thục.', en: 'That deed is not well done of which a man must repent, and the reward of which he receives crying and with a tearful face.' },
  { c: 'V', n: 68, vi: 'Và nghiệp làm chánh thiện,\nLàm rồi không ăn năn,\nHoan hỷ, ý đẹp lòng,\nHưởng thọ quả dị thục.', en: 'No, that deed is well done of which a man does not repent, and the reward of which he receives gladly and cheerfully.' },
  { c: 'V', n: 69, vi: 'Người ngu nghĩ là ngọt,\nKhi ác chưa chín muồi;\nÁc nghiệp chín muồi rồi,\nNgười ngu chịu khổ đau.', en: 'As long as the evil deed done does not bear fruit, the fool thinks it is like honey; but when it ripens, then the fool suffers grief.' },
  { c: 'V', n: 70, vi: 'Tháng tháng với ngọn cỏ,\nNgười ngu có ăn uống\nKhông bằng phần mười sáu\nNgười hiểu pháp hữu vi.', en: 'Let a fool month after month eat his food (like an ascetic) with the tip of a blade of Kusa grass, yet he is not worth the sixteenth particle of those who have well weighed the law.' },
  { c: 'V', n: 71, vi: 'Nghiệp ác đã được làm,\nNhư sữa, không đông ngay,\nCháy ngầm theo kẻ ngu,\nNhư lửa tro che đậy.', en: 'An evil deed, like newly-drawn milk, does not turn (suddenly); smouldering, like fire covered by ashes, it follows the fool.' },
  { c: 'V', n: 72, vi: 'Tự nó chịu bất hạnh,\nKhi danh đến kẻ ngu.\nVận may bị tổn hại,\nĐầu nó bị nát tan.', en: 'And when the evil deed, after it has become known, brings sorrow to the fool, then it destroys his bright lot, nay, it cleaves his head.' },
  { c: 'V', n: 73, vi: 'Ưa danh không tương xứng,\nMuốn ngồi trước tỷ kheo,\nƯa quyền tại tịnh xá,\nMuốn mọi người lễ kính.', en: 'Let the fool wish for a false reputation, for precedence among the Bhikshus, for lordship in the convents, for worship among other people!' },
  { c: 'V', n: 74, vi: 'Mong cả hai Tăng, tục,\nNghĩ rằng: “Chính ta làm,\nTrong mọi việc lớn nhỏ,\nPhải theo mệnh lệnh ta”\nNgười ngu nghĩ như vậy\nDục và mạn tăng trưởng.', en: '"May both the layman and he who has left the world think that this is done by me; may they be subject to me in everything which is to be done or is not to be done," thus is the mind of the fool, and his desire and pride increase.' },
  { c: 'V', n: 75, vi: 'Khác thay duyên thế lợi,\nKhác thay đường Niết Bàn.\nTỷ kheo, đệ tử Phật,\nHãy như vậy thắng tri.\nChớ ưa thích cung kính,\nHãy tu hạnh viễn ly.', en: '"One is the road that leads to wealth, another the road that leads to Nirvana;" if the Bhikshu, the disciple of Buddha, has learnt this, he will not yearn for honour, he will strive after separation from the world.' },
  { c: 'VI', n: 76, vi: 'Nếu thấy bậc hiền trí,\nChỉ lỗi và khiển trách,\nNhư chỉ chỗ chôn vàng\nHãy thân cận người trí !\nThân cận người như vậy,\nChỉ tốt hơn, không xấu.', en: 'If you see an intelligent man who tells you where true treasures are to be found, who shows what is to be avoided, and administers reproofs, follow that wise man; it will be better, not worse, for those who follow him.' },
  { c: 'VI', n: 77, vi: 'Những người hay khuyên dạy,\nNgăn người khác làm ác,\nĐược người hiền kính yêu,\nBị người ác không thích.', en: 'Let him admonish, let him teach, let him forbid what is improper!--he will be beloved of the good, by the bad he will be hated.' },
  { c: 'VI', n: 78, vi: 'Chớ thân với bạn ác,\nChớ thân kẻ tiểu nhân.\nHãy thân người bạn lành,\nHãy thân bậc thượng nhân.', en: 'Do not have evil-doers for friends, do not have low people for friends: have virtuous people for friends, have for friends the best of men.' },
  { c: 'VI', n: 79, vi: 'Pháp hỷ đem an lạc,\nVới tâm tư thuần tịnh;\nNgười trí thường hoan hỷ,\nVới pháp bậc Thánh thuyết.', en: 'He who drinks in the law lives happily with a serene mind: the sage rejoices always in the law, as preached by the elect (Ariyas).' },
  { c: 'VI', n: 80, vi: 'Người trị thủy dẫn nước,\nKẻ làm tên nắn tên,\nNgười thợ mộc uốn gỗ,\nBậc trí nhiếp tự thân.', en: 'Well-makers lead the water (wherever they like); fletchers bend the arrow; carpenters bend a log of wood; wise people fashion themselves.' },
  { c: 'VI', n: 81, vi: 'Như đá tảng kiên cố,\nKhông gió nào dao động,\nCũng vậy, giữa khen chê,\nNgười trí không giao động.', en: 'As a solid rock is not shaken by the wind, wise people falter not amidst blame and praise.' },
  { c: 'VI', n: 82, vi: 'Như hồ nước sâu thẳm,\nTrong sáng, không khuấy đục,\nCũng vậy, nghe chánh pháp,\nNgười trí hưởng tịnh lạc.    ', en: 'Wise people, after they have listened to the laws, become serene, like a deep, smooth, and still lake.' },
  { c: 'VI', n: 83, vi: 'Người hiền bỏ tất cả,\nNgười lành không bàn dục,\nDầu cảm thọ lạc khổ,\nBậc trí không vui buồn.', en: 'Good people walk on whatever befall, the good do not prattle, longing for pleasure; whether touched by happiness or sorrow wise people never appear elated or depressed.' },
  { c: 'VI', n: 84, vi: 'Không vì mình, vì người.\nKhông cầu được con cái,\nKhông tài sản quốc độ,\nKhông cầu mình thành tựu,\nVới việc làm phi pháp.\nVị ấy thật trì giới,\nCó trí tuệ, đúng pháp.', en: 'If, whether for his own sake, or for the sake of others, a man wishes neither for a son, nor for wealth, nor for lordship, and if he does not wish for his own success by unfair means, then he is good, wise, and virtuous.' },
  { c: 'VI', n: 85, vi: 'Ít người giữa nhân loại,\nĐến được bờ bên kia\nCòn số người còn lại,\nXuôi ngược chạy bờ này.', en: 'Few are there among men who arrive at the other shore (become Arhats); the other people here run up and down the shore.' },
  { c: 'VI', n: 86, vi: 'Những ai hành trì pháp,\nTheo chánh pháp khéo dạy, \nSẽ đến bờ bên kia,\nVượt ma lực khó thoát.', en: 'But those who, when the law has been well preached to them, follow the law, will pass across the dominion of death, however difficult to overcome.' },
  { c: 'VI', n: 87, vi: 'Kẻ trí bỏ pháp đen,\nTu tập theo pháp trắng.\nBỏ nhà, sống không nhà,\nSống viễn ly khổ lạc.', en: 'A wise man should leave the dark state (of ordinary life), and follow the bright state (of the Bhikshu). After going from his home to a homeless state, he should in his retirement look for enjoyment where there seemed to be no enjoyment. Leaving all pleasures behind, and calling nothing his own, the wise man should purge himself from all the troubles of the mind.' },
  { c: 'VI', n: 88, vi: 'Hãy cầu vui Niết Bàn,\nBỏ dục, không sở hữu,\nKẻ trí tự rửa sạch,\nCấu uế từ nội tâm.', en: 'A wise man should leave the dark state (of ordinary life), and follow the bright state (of the Bhikshu). After going from his home to a homeless state, he should in his retirement look for enjoyment where there seemed to be no enjoyment. Leaving all pleasures behind, and calling nothing his own, the wise man should purge himself from all the troubles of the mind.' },
  { c: 'VI', n: 89, vi: 'Những ai với chánh tâm,\nKhéo tu tập giác chi,\nTừ bỏ mọi ái nhiễm,\nHoan hỷ không chấp thủ.\nKhông lậu hoặc, sáng chói,\nSống tịch tịnh ở đời.', en: 'Those whose mind is well grounded in the (seven) elements of knowledge, who without clinging to anything, rejoice in freedom from attachment, whose appetites have been conquered, and who are full of light, are free (even) in this world.' },
  { c: 'VII', n: 90, vi: 'Đích đã đến, không sầu,\nGiải thoát ngoài tất cả,\nĐoạn trừ mọi buộc ràng,\nVị ấy không nhiệt não. ', en: 'There is no suffering for him who has finished his journey, and abandoned grief, who has freed himself on all sides, and thrown off all fetters.' },
  { c: 'VII', n: 91, vi: 'Tự sách tấn, chánh niệm,\nKhông thích cư xá nào,\nNhư ngỗng trời rời ao,\nBỏ sau mọi trú ẩn.', en: 'They depart with their thoughts well-collected, they are not happy in their abode; like swans who have left their lake, they leave their house and home.' },
  { c: 'VII', n: 92, vi: 'Tài sản không chất chứa,\nĂn uống biết liễu tri,\nTự tại trong hành xứ,\nKhông vô tướng, giải thoát,\nNhư chim giữa hư không,\nHướng chúng đi khó tìm.', en: 'Men who have no riches, who live on recognised food, who have perceived void and unconditioned freedom (Nirvana), their path is difficult to understand, like that of birds in the air.' },
  { c: 'VII', n: 93, vi: 'Ai lậu hoặc đoạn sạch,\nĂn uống không tham đắm,\nTự tại trong hành xứ,\nKhông, vô tướng giải thoát.\nNhư chim giữa hư không,\nDấu chân thật khó tìm.', en: 'He whose appetites are stilled, who is not absorbed in enjoyment, who has perceived void and unconditioned freedom (Nirvana), his path is difficult to understand, like that of birds in the air.' },
  { c: 'VII', n: 94, vi: 'Ai nhiếp phục các căn,\nNhư đánh xe điều ngự,\nMạn trừ, lậu hoặc dứt,\nNgười vậy, Chư Thiên mến.', en: 'The gods even envy him whose senses, like horses well broken in by the driver, have been subdued, who is free from pride, and free from appetites.' },
  { c: 'VII', n: 95, vi: 'Như đất, không hiềm hận,\nNhư cột trụ, kiên trì,\nNhư hồ, không bùn nhơ,\nKhông luân hồi, vị ấy.', en: 'Such a one who does his duty is tolerant like the earth, like Indra\'s bolt; he is like a lake without mud; no new births are in store for him.' },
  { c: 'VII', n: 96, vi: 'Người tâm ý an tịnh,\nLời an, nghiệp cũng an,\nChánh trí, chơn giải thoát,\nTịnh lạc là vị ấy.', en: 'His thought is quiet, quiet are his word and deed, when he has obtained freedom by true knowledge, when he has thus become a quiet man.' },
  { c: 'VII', n: 97, vi: 'Không tin, hiểu vô vi.\nNgười cắt mọi hệ lụy\nCơ hội tận, xã ly\nVị ấy thật tối thượng.', en: 'The man who is free from credulity, but knows the uncreated, who has cut all ties, removed all temptations, renounced all desires, he is the greatest of men.' },
  { c: 'VII', n: 98, vi: 'Làng mạc hay rừng núi\nThung lũng hay đồi cao,\nLa Hán trú chỗ nào,\nĐất ấy thật khả ái.', en: 'In a hamlet or in a forest, in the deep water or on the dry land, wherever venerable persons (Arhanta) dwell, that place is delightful.' },
  { c: 'VII', n: 99, vi: 'Khả ái thay núi rừng,\nChỗ người phàm không ưa,\nVị ly tham ưa thích,\nVì không tìm dục lạc.', en: 'Forests are delightful; where the world finds no delight, there the passionless will find delight, for they look not for pleasures.' },
  { c: 'VIII', n: 100, vi: 'Dầu nói ngàn ngàn lời,\nNhưng không gì lợi ích ,\nTốt hơn một câu nghĩa,\nNghe xong, được tịnh lạc.', en: 'Even though a speech be a thousand (of words), but made up of senseless words, one word of sense is better, which if a man hears, he becomes quiet.' },
  { c: 'VIII', n: 101, vi: 'Dầu nói ngàn câu kệ\nNhưng không gì lợi ích,\nTốt hơn nói một câu,\nNghe xong, được tịnh lạc.', en: 'Even though a Gatha (poem) be a thousand (of words), but made up of senseless words, one word of a Gatha is better, which if a man hears, he becomes quiet.' },
  { c: 'VIII', n: 102, vi: 'Dầu nói trăm câu kệ\nNhưng không gì lợi ích,\nTốt hơn một câu pháp,\nNghe xong, được tịnh lạc.', en: 'Though a man recite a hundred Gathas made up of senseless words, one word of the law is better, which if a man hears, he becomes quiet.' },
  { c: 'VIII', n: 103, vi: 'Dầu tại bãi chiến trường\nThắng ngàn ngàn quân địch,\nTự thắng mình tốt hơn,\nThật chiến thắng tối thượng.', en: 'If one man conquer in battle a thousand times thousand men, and if another conquer himself, he is the greatest of conquerors.' },
  { c: 'VIII', n: 104, vi: 'Tự thắng, tốt đẹp hơn,\nHơn chiến thắng người khác.\nNgười khéo điều phục mình,\nThường sống tự chế ngự.', en: 'One\'s own self conquered is better than all other people; not even a god, a Gandharva, not Mara with Brahman could change into defeat the victory of a man who has vanquished himself, and always lives under restraint.' },
  { c: 'VIII', n: 105, vi: 'Dầu Thiên Thần, Thát Bà,\nDầu Ma vương, Phạm Thiên\nKhông ai chiến thắng nổi,\nNgười tự thắng như vậy.', en: 'One\'s own self conquered is better than all other people; not even a god, a Gandharva, not Mara with Brahman could change into defeat the victory of a man who has vanquished himself, and always lives under restraint.' },
  { c: 'VIII', n: 106, vi: 'Tháng tháng bỏ ngàn vàng,\nTế tự cả trăm năm, \nChẳng bằng trong giây lát,\nCúng dường bậc tự tu.\nCùng dường vậy tốt hơn,\nHơn trăm năm tế tự.', en: 'If a man for a hundred years sacrifice month after month with a thousand, and if he but for one moment pay homage to a man whose soul is grounded (in true knowledge), better is that homage than sacrifice for a hundred years.' },
  { c: 'VIII', n: 107, vi: 'Dầu trải một trăm năm,\nThờ lửa tại rừng sâu,\nChẳng bằng trong giây lát,\nCúng dường bậc tự tu.\nCúng dường vậy tốt hơn,\nHơn trăm năm tế tự.', en: 'If a man for a hundred years worship Agni (fire) in the forest, and if he but for one moment pay homage to a man whose soul is grounded (in true knowledge), better is that homage than sacrifice for a hundred years.' },
  { c: 'VIII', n: 108, vi: 'Suốt năm cúng tế vật,\nĐể cầu phước ở đời.\nKhông bằng một phần tư\nKính lễ bậc chánh trực.', en: 'Whatever a man sacrifice in this world as an offering or as an oblation for a whole year in order to gain merit, the whole of it is not worth a quarter (a farthing); reverence shown to the righteous is better.' },
  { c: 'VIII', n: 109, vi: 'Thường tôn trọng, kính lễ\nBậc kỳ lão trưởng thượng,\nBốn pháp được tăng trưởng:\nThọ, sắc, lạc, sức mạnh.', en: 'He who always greets and constantly reveres the aged, four things will increase to him, viz. life, beauty, happiness, power.' },
  { c: 'VIII', n: 110, vi: 'Dầu sống một trăm năm\nÁc giới, không thiền định,\nKhông bằng sống một ngày,\nTrì giới, tu thiền định. ', en: 'But he who lives a hundred years, vicious and unrestrained, a life of one day is better if a man is virtuous and reflecting.' },
  { c: 'VIII', n: 111, vi: 'Ai sống một trăm năm,\nÁc tuệ, không thiền định.\nTốt hơn sống một ngày,\nCó tuệ, tu thiền định.', en: 'And he who lives a hundred years, ignorant and unrestrained, a life of one day is better if a man is wise and reflecting.' },
  { c: 'VIII', n: 112, vi: 'Ai sống một trăm năm,\nLười nhác không tinh tấn,\nTốt hơn sống một ngày\nTinh tấn tận sức mình.', en: 'And he who lives a hundred years, idle and weak, a life of one day is better if a man has attained firm strength.' },
  { c: 'VIII', n: 113, vi: 'Ai sống một trăm năm,\nKhông thấy pháp sinh diệt,\nTốt hơn sống một ngày,\nThấy được pháp sinh diệt.', en: 'And he who lives a hundred years, not seeing beginning and end, a life of one day is better if a man sees beginning and end.' },
  { c: 'VIII', n: 114, vi: 'Ai sống một trăm năm,\nKhông thấy câu bất tử,\nTốt hơn sống một ngày,\nThấy được câu bất tử.', en: 'And he who lives a hundred years, not seeing the immortal place, a life of one day is better if a man sees the immortal place.' },
  { c: 'VIII', n: 115, vi: 'Ai sống một trăm năm,\nKhông thấy pháp tối thượng,\nTốt hơn sống một ngày,\nThấy được pháp tối thượng.', en: 'And he who lives a hundred years, not seeing the highest law, a life of one day is better if a man sees the highest law.' },
  { c: 'IX', n: 116, vi: 'Hãy gấp làm điều lành,\nNgăn tâm làm điều ác.\nAi chậm làm việc lành,\nÝ ưa thích việc ác.', en: 'If a man would hasten towards the good, he should keep his thought away from evil; if a man does what is good slothfully, his mind delights in evil.' },
  { c: 'IX', n: 117, vi: 'Nếu người làm điều ác,\nChớ tiếp tục làm thêm.\nChớ ước muốn điều ác,\nChứa ác, tất chịu khổ.', en: 'If a man commits a sin, let him not do it again; let him not delight in sin: pain is the outcome of evil.' },
    { c: 'IX', n: 118, vi: 'Nếu người làm điều thiện,\nNên tiếp tục làm thêm.\nHãy ước muốn điều thiện,\nChứa thiện, được an lạc.', en: 'If a man does what is good, let him do it again; let him delight in it: happiness is the outcome of good.' },
  { c: 'IX', n: 119, vi: 'Người ác thấy là hiền.\nKhi ác chưa chín muồi,\nKhi ác nghiệp chín muồi,\nNgười ác mới thấy ác.', en: 'Even an evil-doer sees happiness as long as his evil deed has not ripened; but when his evil deed has ripened, then does the evil-doer see evil.' },
  { c: 'IX', n: 120, vi: 'Người hiền thấy là ác,\nKhi thiện chưa chín muồi.\nKhi thiện được chín muồi,\nNgười hiền thấy là thiện.', en: 'Even a good man sees evil days, as long as his good deed has not ripened; but when his good deed has ripened, then does the good man see happy days.' },
  { c: 'IX', n: 121, vi: 'Chớ chê khinh điều ác,\nCho rằng chưa đến mình,\nNhư nước nhỏ từng giọt,\nRồi bình cũng đầy tràn.\nNgười ngu chứa đầy ác\nDo chất chứa dần dần.', en: 'Let no man think lightly of evil, saying in his heart, It will not come nigh unto me. Even by the falling of water-drops a water-pot is filled; the fool becomes full of evil, even if he gather it little by little.' },
  { c: 'IX', n: 122, vi: 'Chớ chê khinh điều thiện\nCho rằng chưa đến mình,\nNhư nước nhỏ từng giọt,\nRồi bình cũng đầy tràn.\nNgười trí chứa đầy thiện,\nDo chất chứa dần dần.', en: 'Let no man think lightly of good, saying in his heart, It will not come nigh unto me. Even by the falling of water-drops a water-pot is filled; the wise man becomes full of good, even if he gather it little by little.' },
  { c: 'IX', n: 123, vi: 'Ít bạn đường, nhiều tiền,\nNgười buôn tránh đường hiểm.\nMuốn sống, tránh thuốc độc,\nHãy tránh ác như vậy.', en: 'Let a man avoid evil deeds, as a merchant, if he has few companions and carries much wealth, avoids a dangerous road; as a man who loves life avoids poison.' },
  { c: 'IX', n: 124, vi: 'Bàn tay không thương tích,\nCó thể cầm thuốc độc.\nKhông thương tích, tránh độc,\nKhông làm, không có ác.', en: 'He who has no wound on his hand, may touch poison with his hand; poison does not affect one who has no wound; nor is there evil for one who does not commit evil.' },
  { c: 'IX', n: 125, vi: 'Hại người không ác tâm,\nNgười thanh tịnh, không uế,\nTội ác đến kẻ ngu,\nNhư ngược gió tung bụi.', en: 'If a man offend a harmless, pure, and innocent person, the evil falls back upon that fool, like light dust thrown up against the wind.' },
  { c: 'IX', n: 126, vi: 'Một số sinh bào thai,\nKẻ ác sinh địa ngục,\nNgười thiện lên cõi trời,\nVô lậu chứng Niết Bàn.', en: 'Some people are born again; evil-doers go to hell; righteous people go to heaven; those who are free from all worldly desires attain Nirvana.' },
  { c: 'IX', n: 127, vi: 'Không trên trời, giữa biển,\nKhông lánh vào động núi,\nKhông chỗ nào trên đời,\nTrốn được quả ác nghiệp.', en: 'Not in the sky, not in the midst of the sea, not if we enter into the clefts of the mountains, is there known a spot in the whole world where a man might be freed from an evil deed.' },
  { c: 'IX', n: 128, vi: 'Không trên trời, giữa biển,\nKhông lánh vào động núi,\nKhông chỗ nào trên đời,\nTrốn khỏi tay thần chết.', en: 'Not in the sky, not in the midst of the sea, not if we enter into the clefts of the mountains, is there known a spot in the whole world where death could not overcome (the mortal). ' },
  { c: 'X', n: 129, vi: 'Mọi người sợ hình phạt,\nMọi người sợ tử vong.\nLấy mình làm ví dụ\nKhông giết, không bảo giết.', en: 'All men tremble at punishment, all men fear death; remember that you are like unto them, and do not kill, nor cause slaughter.' },
  { c: 'X', n: 130, vi: 'Mọi người sợ hình phạt,\nMọi người thích sống còn;\nLấy mình làm ví dụ,\nKhông giết, không bảo giết. ', en: 'All men tremble at punishment, all men love life; remember that thou art like unto them, and do not kill, nor cause slaughter.' },
  { c: 'X', n: 131, vi: 'Chúng sanh cầu an lạc,\nAi dùng trượng hại người,\nĐể tìm lạc cho mình,\nĐời sau không được lạc.', en: 'He who seeking his own happiness punishes or kills beings who also long for happiness, will not find happiness after death.' },
  { c: 'X', n: 132, vi: 'Chúng sanh cầu an lạc,\nKhông dùng trượng hại người,\nĐể tìm lạc cho mình,\nĐời sau được hưởng lạc.', en: 'He who seeking his own happiness does not punish or kill beings who also long for happiness, will find happiness after death.' },
  { c: 'X', n: 133, vi: 'Chớ nói lời ác độc,\nNói ác, bị nói lại,\nKhổ thay lời phẩn nộ,\nĐao trượng phản chạm mình.', en: 'Do not speak harshly to anybody; those who are spoken to will answer thee in the same way. Angry speech is painful, blows for blows will touch thee.' },
  { c: 'X', n: 134, vi: 'Nếu tự mình yên lặng,\nNhư chiếc chuông bị bể.\nNgươi đã chứng Niết Bàn\nNgươi không còn phẩn nộ.', en: 'If, like a shattered metal plate (gong), thou utter not, then thou hast reached Nirvana; contention is not known to thee.' },
  { c: 'X', n: 135, vi: 'Với gậy, người chăn bò,\nLùa bò ra bãi cỏ;\nCũng vậy, già và chết,\nLùa người đến mạng chung.', en: 'As a cowherd with his staff drives his cows into the stable, so do Age and Death drive the life of men.' },
  { c: 'X', n: 136, vi: 'Người ngu làm điều ác,\nKhông ý thức việc làm. \nDo tự nghiệp, người ngu\nBị nung nấu, như lửa.', en: 'A fool does not know when he commits his evil deeds: but the wicked man burns by his own deeds, as if burnt by fire.' },
  { c: 'X', n: 137, vi: 'Dùng trượng phạt không trượng,\nLàm ác người không ác.\nTrong mười loại khổ đau,\nChịu gấp một loại khổ.', en: 'He who inflicts pain on innocent and harmless persons, will soon come to one of these ten states:' },
  { c: 'X', n: 138, vi: 'Hoặc khổ thọ khốc liệt,\nThân thể bị thương vong,\nHoặc thọ bệnh kịch liệt,\nHay loạn ý tán tâm.', en: 'He will have cruel suffering, loss, injury of the body, heavy affliction, or loss of mind,' },
  { c: 'X', n: 139, vi: 'Hoặc tai họa từ vua,\nHay bị vu trọng tội;\nBà con phải ly tán,\nTài sản bị nát tan.', en: 'Or a misfortune coming from the king, or a fearful accusation, or loss of relations, or destruction of treasures,' },
  { c: 'X', n: 140, vi: 'Hoặc phòng ốc nhà cửa\nBị hỏa tai thiêu đốt.\nKhi thân hoại mạng chung,\nÁc tuệ sanh địa ngục.', en: 'Or lightning-fire will burn his houses; and when his body is destroyed, the fool will go to hell.' },
  { c: 'X', n: 141, vi: 'Không phải sống lõa thể\nBện tóc, tro trét mình,\nTuyệt thực, lăn trên đất,\nSống nhớp, siêng ngồi xổm,\nLàm con người được sạch,\nNếu không trừ nghi hoặc.', en: 'Not nakedness, not platted hair, not dirt, not fasting, or lying on the earth, not rubbing with dust, not sitting motionless, can purify a mortal who has not overcome desires.' },
  { c: 'X', n: 142, vi: 'Ai sống tự trang sức,\nNhưng an tịnh, nhiếp phục,\nSống kiên trì, phạm hạnh,\nKhông hại mọi sinh linh,\nVị ấy là Phạm-chí,\nHay Sa-môn, khất sĩ.', en: 'He who, though dressed in fine apparel, exercises tranquillity, is quiet, subdued, restrained, chaste, and has ceased to find fault with all other beings, he indeed is a Brahmana, an ascetic (sramana), a friar (bhikshu).' },
  { c: 'X', n: 143, vi: 'Thật khó tìm ở đời,\nNgười biết thẹn, tự chế,\nBiết tránh né chỉ trích\nNhư ngựa hiền tránh roi.', en: 'Is there in this world any man so restrained by humility that he does not mind reproof, as a well-trained horse the whip?' },
  { c: 'X', n: 144, vi: 'Như ngựa hiền chạm roi,\nHãy nhiệt tâm, hăng hái,\nVới tín, giới, tinh tấn,\nThiền định cùng trạch pháp.\nMinh hạnh đủ, chánh niệm,\nĐoạn khổ này vô lượng.', en: 'Like a well-trained horse when touched by the whip, be ye active and lively, and by faith, by virtue, by energy, by meditation, by discernment of the law you will overcome this great pain (of reproof), perfect in knowledge and in behaviour, and never forgetful.' },
  { c: 'X', n: 145, vi: 'Người trị thủy dẫn nước,\nKẻ làm tên nắn tên,\nNgười thợ mộc uốn ván,\nBậc tự điều, điều thân. ', en: 'Well-makers lead the water (wherever they like); fletchers bend the arrow; carpenters bend a log of wood; good people fashion themselves.' },
  { c: 'XI', n: 146, vi: 'Cười gì, hân hoan gì,\nKhi đời mãi bị thiêu ?\nBị tối tăm bao trùm,\nSao không tìm ngọn đèn ?', en: 'How is there laughter, how is there joy, as this world is always burning? Why do you not seek a light, ye who are surrounded by darkness?' },
  { c: 'XI', n: 147, vi: 'Hãy xem bong bóng đẹp,\nChỗ chất chứa vết thương,\nBệnh hoạn nhiều suy tư,\nThật không gì trường cửu.', en: 'Look at this dressed-up lump, covered with wounds, joined together, sickly, full of many thoughts, which has no strength, no hold!' },
  { c: 'XI', n: 148, vi: 'Sắc này bị suy già,\nỔ tật bệnh, mỏng manh,\nNhóm bất tịnh, đỗ vỡ,\nChết chấm dứt mạng sống.', en: 'This body is wasted, full of sickness, and frail; this heap of corruption breaks to pieces, life indeed ends in death.' },
  { c: 'XI', n: 149, vi: 'Như trái bầu mùa thu,\nBị vất bỏ quăng đi,\nNhóm xương trắng bồ câu,\nThấy chúng còn vui gì ?', en: 'Those white bones, like gourds thrown away in the autumn, what pleasure is there in looking at them?' },
  { c: 'XI', n: 150, vi: 'Thành này làm bằng xương,\nQuét tô bằng thịt máu,\nỞ đây già và chết,\nMạn, lừa đảo chất chứa.', en: 'After a stronghold has been made of the bones, it is covered with flesh and blood, and there dwell in it old age and death, pride and deceit.' },
  { c: 'XI', n: 151, vi: 'Xe vua đẹp cũng già.\nThân này rồi sẽ già,\nPháp bậc thiện, không già.\nNhư vậy bậc chí thiện\nNói lên cho bậc thiện.', en: 'The brilliant chariots of kings are destroyed, the body also approaches destruction, but the virtue of good people never approaches destruction,--thus do the good say to the good.' },
  { c: 'XI', n: 152, vi: 'Người ít nghe kém học,\nLớn già như trâu đực.\nThịt nó tuy lớn lên,\nNhưng tuệ không tăng trưởng.', en: 'A man who has learnt little, grows old like an ox; his flesh grows, but his knowledge does not grow.' },
  { c: 'XI', n: 153, vi: 'Lang thang bao kiếp sống\nTa tìm nhưng chẳng gặp,\nNgười xây dựng nhà này,\nKhổ thay, phải tái sanh.', en: 'Looking for the maker of this tabernacle, I shall have to run through a course of many births, so long as I do not find (him); and painful is birth again and again. But now, maker of the tabernacle, thou hast been seen; thou shalt not make up this tabernacle again. All thy rafters are broken, thy ridge-pole is sundered; the mind, approaching the Eternal (visankhara, nirvana), has attained to the extinction of all desires.' },
  { c: 'XI', n: 154, vi: 'Ôi ! Người làm nhà kia\nNay ta đã thấy ngươi !\nNgươi không làm nhà nữa.\nĐòn tay ngươi bị gãy,\nKèo cột ngươi bị tan\nTâm ta đạt tịch diệt,\nTham ái thảy tiêu vong.', en: 'Looking for the maker of this tabernacle, I shall have to run through a course of many births, so long as I do not find (him); and painful is birth again and again. But now, maker of the tabernacle, thou hast been seen; thou shalt not make up this tabernacle again. All thy rafters are broken, thy ridge-pole is sundered; the mind, approaching the Eternal (visankhara, nirvana), has attained to the extinction of all desires.' },
  { c: 'XI', n: 155, vi: 'Lúc trẻ, không Phạm hạnh,\nKhông tìm kiếm bạc tiền.\nNhư cò già bên ao,\nỦ rũ, không tôm cá.', en: 'Men who have not observed proper discipline, and have not gained treasure in their youth, perish like old herons in a lake without fish.' },
  { c: 'XI', n: 156, vi: 'Lúc trẻ không phạm hạnh,\nKhông tìm kiếm bạc tiền;\nNhư cây cung bị gẫy,\nThở than những ngày qua.', en: 'Men who have not observed proper discipline, and have not gained treasure in their youth, lie, like broken bows, sighing after the past.' },
  { c: 'XII', n: 157, vi: 'Nếu biết yêu tự ngã,\nPhải khéo bảo vệ mình,\nNgười trí trong ba canh,\nPhải luôn luôn tỉnh thức.', en: 'If a man hold himself dear, let him watch himself carefully; during one at least out of the three watches a wise man should be watchful.' },
  { c: 'XII', n: 158, vi: 'Trước hết tự đặt mình,\nVào những gì thích đáng.\nSau mới giáo hóa người,\nNgười trí khỏi bị nhiễm.', en: 'Let each man direct himself first to what is proper, then let him teach others; thus a wise man will not suffer.' },
  { c: 'XII', n: 159, vi: 'Hãy tự làm cho mình,\nNhư điều mình dạy người.\nKhéo tự điều, điều người,\nKhó thay, tự điều phục !', en: 'If a man make himself as he teaches others to be, then, being himself well subdued, he may subdue (others); one\'s own self is indeed difficult to subdue.' },
  { c: 'XII', n: 160, vi: 'Tự mình y chỉ mình,\nNào có y chỉ khác.\nNhờ khéo điều phục mình,\nĐược y chỉ khó được.', en: 'Self is the lord of self, who else could be the lord? With self well subdued, a man finds a lord such as few can find.' },
  { c: 'XII', n: 161, vi: 'Điều ác tự mình làm,\nTự mình sanh, mình tạo.\nNghiền nát kẻ ngu si,\nNhư kim cương, ngọc báu.', en: 'The evil done by oneself, self-begotten, self-bred, crushes the foolish, as a diamond breaks a precious stone.' },
  { c: 'XII', n: 162, vi: 'Phá giới quá trầm trọng,\nNhư dây leo bám cây\nGieo hại cho tự thân,\nNhư kẻ thù mong ước.', en: 'He whose wickedness is very great brings himself down to that state where his enemy wishes him to be, as a creeper does with the tree which it surrounds.' },
  { c: 'XII', n: 163, vi: 'Dễ làm, các điều ác,\nDễ làm tự hại mình.\nCòn việc lành, việc tốt,\nThật tối thượng khó làm.', en: 'Bad deeds, and deeds hurtful to ourselves, are easy to do; what is beneficial and good, that is very difficult to do.' },
  { c: 'XII', n: 164, vi: 'Kẻ ngu si miệt thị,\nGiáo pháp bậc La Hán,\nBậc Thánh, bậc Chánh mạng.\nChính do ác kiến này,\nNhư quả loại cây lau\nMang quả tự hoại diệt.', en: 'The foolish man who scorns the rule of the venerable (Arahat), of the elect (Ariya), of the virtuous, and follows false doctrine, he bears fruit to his own destruction, like the fruits of the Katthaka reed.' },
  { c: 'XII', n: 165, vi: 'Tự mình, điều ác làm,\nTự mình làm nhiễm ô,\nTự mình không làm ác,\nTự mình làm thanh tịnh.\nTịnh, không tịnh tự mình,\nKhông ai thanh tịnh ai !', en: 'By oneself the evil is done, by oneself one suffers; by oneself evil is left undone, by oneself one is purified. Purity and impurity belong to oneself, no one can purify another.' },
  { c: 'XII', n: 166, vi: 'Dầu lợi người bao nhiêu,\nChớ quên phần tư lợi\nNhờ thắng tri tư lợi,\nHãy chuyên tâm lợi mình.', en: 'Let no one forget his own duty for the sake of another\'s, however great; let a man, after he has discerned his own duty, be always attentive to his duty.' },
  { c: 'XIII', n: 167, vi: 'Chớ có theo pháp hạ liệt,\nChớ sống mặc, buông lung,\nChớ tin theo tà kiến,\nChớ tăng trưởng tục trần.\n ', en: 'Do not follow the evil law! Do not live on in thoughtlessness! Do not follow false doctrine! Be not a friend of the world.' },
  { c: 'XIII', n: 168, vi: 'Nỗ lực, chớ phóng dật !\nHãy sống theo chánh hạnh;\nNgười chánh hạnh hưởng lạc,\nCả đời này, đời sau.', en: 'Rouse thyself! do not be idle! Follow the law of virtue! The virtuous rests in bliss in this world and in the next.' },
  { c: 'XIII', n: 169, vi: 'Hãy khéo sống chánh hạnh,\nChớ sống theo tà hạnh !\nNgười chánh hạnh hưởng lạc,\nCả đời này, đời sau.', en: 'Follow the law of virtue; do not follow that of sin. The virtuous rests in bliss in this world and in the next.' },
  { c: 'XIII', n: 170, vi: 'Hãy nhìn như bọt nước,\nHãy nhìn như cảnh huyển !\nQuán nhìn đời như vậy,\nThần chết không bắt gặp. ', en: 'Look upon the world as a bubble, look upon it as a mirage: the king of death does not see him who thus looks down upon the world.' },
  { c: 'XIII', n: 171, vi: 'Hãy đến nhìn đời này,\nNhư xe vua lộng lẫy,\nNgười ngu mới tham đắm,\nKẻ trí nào đắm say.', en: 'Come, look at this glittering world, like unto a royal chariot; the foolish are immersed in it, but the wise do not touch it.' },
  { c: 'XIII', n: 172, vi: 'Ai sống trước buông lung,\nSau sống không phóng dật,\nChói sáng rực đời này.\nNhư trăng thoát mây che.', en: 'He who formerly was reckless and afterwards became sober, brightens up this world, like the moon when freed from clouds.' },
  { c: 'XIII', n: 173, vi: 'Ai dùng các hạnh lành,\nLàm xóa mờ nghiệp ác,\nChói sáng rực đời này,\nNhư trăng thoát mây che.', en: 'He whose evil deeds are covered by good deeds, brightens up this world, like the moon when freed from clouds.' },
  { c: 'XIII', n: 174, vi: 'Đời này thật mù quáng,\nÍt kẻ thấy rõ ràng.\nNhư chim thoát khỏi lưới,\nRất ít đi thiên giới.', en: 'This world is dark, few only can see here; a few only go to heaven, like birds escaped from the net.' },
  { c: 'XIII', n: 175, vi: 'Như chim thiên nga bay,\nThần thông liệng giữa trời;\nChiến thắng Ma, Ma quân,\nKẻ trí thoát đời này.', en: 'The swans go on the path of the sun, they go through the ether by means of their miraculous power; the wise are led out of this world, when they have conquered Mara and his train.' },
  { c: 'XIII', n: 176, vi: 'Ai vi phạm một pháp,\nAi nói lời vọng ngữ,\nAi bác bỏ đời sau,\nKhông ác nào không làm.', en: 'If a man has transgressed one law, and speaks lies, and scoffs at another world, there is no evil he will not do.' },
  { c: 'XIII', n: 177, vi: 'Keo kiết không sanh thiên,\nKẻ ngu ghét bố thí,\nNgười trí thích bố thí,\nĐời sau, được hưởng lạc.', en: 'The uncharitable do not go to the world of the gods; fools only do not praise liberality; a wise man rejoices in liberality, and through it becomes blessed in the other world.' },
  { c: 'XIII', n: 178, vi: 'Hơn thống lãnh cõi đất,\nHơn được sanh cõi trời,\nHơn chủ trì vũ trụ,\nQuả Dự Lưu tối thắng.', en: 'Better than sovereignty over the earth, better than going to heaven, better than lordship over all worlds, is the reward of the first step in holiness.' },
  { c: 'XIV', n: 179, vi: 'Vị chiến thắng không bại,\nVị bước đi trên đời,\nKhông dấu tích chiến thắng,\nPhật giới rộng mênh mông,\nAi dùng chân theo dõi\nBậc không để dấu tích ?', en: 'He whose conquest is not conquered again, into whose conquest no one in this world enters, by what track can you lead him, the Awakened, the Omniscient, the trackless?' },
  { c: 'XIV', n: 180, vi: 'Ai giải tỏa lưới tham,\nÁi phược hết dắt dẫn,\nPhật giới rộng mênh mông,\nAi dùng chân theo dõi,\nBậc không để dấu tích ? ', en: 'He whom no desire with its snares and poisons can lead astray, by what track can you lead him, the Awakened, the Omniscient, the trackless?' },
  { c: 'XIV', n: 181, vi: 'Người trí chuyên thiền định,\nThích an tịnh viễn ly,\nChư thiên đều ái kính,\nBậc chánh giác chánh niệm.', en: 'Even the gods envy those who are awakened and not forgetful, who are given to meditation, who are wise, and who delight in the repose of retirement (from the world).' },
  { c: 'XIV', n: 182, vi: 'Khó thay, được làm người,\nKhó thay, được sống còn,\nKhó thay, nghe diệu pháp,\nKhó thay, Phật ra đời !', en: 'Difficult (to obtain) is the conception of men, difficult is the life of mortals, difficult is the hearing of the True Law, difficult is the birth of the Awakened (the attainment of Buddhahood).' },
  { c: 'XIV', n: 183, vi: 'Không làm mọi điều ác.\nThành tựu các hạnh lành,\nTâm ý giữ trong sạch,\nChính lời chư Phật dạy.', en: 'Not to commit any sin, to do good, and to purify one\'s mind, that is the teaching of (all) the Awakened.' },
  { c: 'XIV', n: 184, vi: 'Chư Phật thường giảng dạy;\nNhẫn, khổ hạnh tối thượng,\nNiết bàn, quả tối thượng;\nXuất gia không phá người;\nSa-môn không hại người.', en: 'The Awakened call patience the highest penance, long-suffering the highest Nirvana; for he is not an anchorite (pravragita) who strikes others, he is not an ascetic (sramana) who insults others.' },
  { c: 'XIV', n: 185, vi: 'Không phỉ báng, phá hoại,\nHộ trì giới căn bản,\nĂn uống có tiết độ,\nSàng tọa chỗ nhàn tịnh\nChuyên chú tăng thượng tâm,\nChính lời chư Phật dạy.', en: 'Not to blame, not to strike, to live restrained under the law, to be moderate in eating, to sleep and sit alone, and to dwell on the highest thoughts,--this is the teaching of the Awakened.' },
  { c: 'XIV', n: 186, vi: 'Dầu mưa bằng tiền vàng,\nCác dục khó thỏa mãn.\nDục đắng nhiều, ngọt ít,\nBiết vậy là bậc trí.', en: 'There is no satisfying lusts, even by a shower of gold pieces; he who knows that lusts have a short taste and cause pain, he is wise;' },
  { c: 'XIV', n: 187, vi: 'Đệ tử bậc Chánh giác,\nKhông tìm cầu dục lạc,\nDầu là dục chư thiên,\nChỉ ưa thích ái diệt.', en: 'Even in heavenly pleasures he finds no satisfaction, the disciple who is fully awakened delights only in the destruction of all desires.' },
  { c: 'XIV', n: 188, vi: 'Loài người sợ hoảng hốt,\nTìm nhiều chỗ quy y,\nHoặc rừng rậm, núi non,\nHoặc vườn cây, đền tháp.', en: 'Men, driven by fear, go to many a refuge, to mountains and forests, to groves and sacred trees.' },
  { c: 'XIV', n: 189, vi: 'Quy y ấy không ổn,\nKhông quy y tối thượng.\nQuy y các chỗ ấy,\nKhông thoát mọi khổ đau ?', en: 'But that is not a safe refuge, that is not the best refuge; a man is not delivered from all pains after having gone to that refuge.' },
  { c: 'XIV', n: 190, vi: 'Ai quy y Đức Phật,\nChánh pháp và chư tăng,\nAi dùng chánh tri kiến,\nThấy được bốn Thánh đế.', en: 'He who takes refuge with Buddha, the Law, and the Church; he who, with clear understanding, sees the four holy truths:--' },
  { c: 'XIV', n: 191, vi: 'Thấy khổ và khổ tập,\nThấy sự khổ vượt qua, \nThấy đường Thánh tám ngành,\nĐưa đến khổ não tận.', en: 'Viz. pain, the origin of pain, the destruction of pain, and the eightfold holy way that leads to the quieting of pain;--' },
  { c: 'XIV', n: 192, vi: 'Thật quy y an ổn,\nThật quy y tối thượng,\nCó quy y như vậy,\nMới thoát mọi khổ đau.', en: 'That is the safe refuge, that is the best refuge; having gone to that refuge, a man is delivered from all pain.' },
  { c: 'XIV', n: 193, vi: 'Khó gặp bậc Thánh nhơn,\nKhông phải đâu cũng có.\nChỗ nào bậc trí sanh,\nGia đình tất an lạc.', en: 'A supernatural person (a Buddha) is not easily found, he is not born everywhere. Wherever such a sage is born, that race prospers.' },
  { c: 'XIV', n: 194, vi: 'Vui thay, Phật ra đời !\nVui thay, Pháp được giảng !\nVui thay, Tăng hòa hợp !\nHòa hợp tu, vui thay !', en: 'Happy is the arising of the awakened, happy is the teaching of the True Law, happy is peace in the church, happy is the devotion of those who are at peace.' },
  { c: 'XIV', n: 195, vi: 'Cúng dường bậc đáng cúng,\nChư Phật hoặc đệ tử,\nCác bậc vượt hý luận,\nĐoạn diệt mọi sầu bi.', en: 'He who pays homage to those who deserve homage, whether the awakened (Buddha) or their disciples, those who have overcome the host (of evils), and crossed the flood of sorrow, he who pays homage to such as have found deliverance and know no fear, his merit can never be measured by anybody.' },
  { c: 'XIV', n: 196, vi: 'Cúng dường bậc như vậy,\nTịch tịnh, không sợ hãi,\nCác công đức như vậy,\nKhông ai ước lường được. ', en: 'He who pays homage to those who deserve homage, whether the awakened (Buddha) or their disciples, those who have overcome the host (of evils), and crossed the flood of sorrow, he who pays homage to such as have found deliverance and know no fear, his merit can never be measured by anybody.' },
  { c: 'XV', n: 197, vi: 'Vui thay, chúng ta sống,\nKhông hận, giữa hận thù !\nGiữa những người thù hận,\nTa sống, không hận thù !', en: 'Let us live happily then, not hating those who hate us! among men who hate us let us dwell free from hatred!' },
  { c: 'XV', n: 198, vi: 'Vui thay, chúng ta sống,\nKhông bệnh, giữa ốm đau !\nGiữa những người bệnh hoạn,\nTa sống, không ốm đau.', en: 'Let us live happily then, free from ailments among the ailing! among men who are ailing let us dwell free from ailments!' },
  { c: 'XV', n: 199, vi: 'Vui thay, chúng ta sống,\nKhông rộn giữa rộn ràng;\nGiữa những người rộn ràng,\nTa sống, không rộn ràng.', en: 'Let us live happily then, free from greed among the greedy! among men who are greedy let us dwell free from greed!' },
  { c: 'XV', n: 200, vi: 'Vui thay chúng ta sống,\nKhông gì, gọi của ta.\nTa sẽ hưởng hỷ lạc,\nNhư chư thiên Quang Âm.', en: 'Let us live happily then, though we call nothing our own! We shall be like the bright gods, feeding on happiness!' },
  { c: 'XV', n: 201, vi: 'Chiến thắng sinh thù oán,\nThất bại chịu khổ đau,\nSống tịch tịnh an lạc.\nBỏ sau mọi thắng bại. ', en: 'Victory breeds hatred, for the conquered is unhappy. He who has given up both victory and defeat, he, the contented, is happy.' },
  { c: 'XV', n: 202, vi: 'Lửa nào sánh lửa tham ?\nÁc nào bằng sân hận ?\nKhổ nào sánh khổ uẩn,\nLạc nào bằng tịnh lạc.', en: 'There is no fire like passion; there is no losing throw like hatred; there is no pain like this body; there is no happiness higher than rest.' },
  { c: 'XV', n: 203, vi: 'Đói ăn, bệnh tối thượng,\nCác hành, khổ tối thượng,\nHiểu như thực là vậy,\nNiết-bàn, lạc tối thượng.', en: 'Hunger is the worst of diseases, the body the greatest of pains; if one knows this truly, that is Nirvana, the highest happiness.' },
  { c: 'XV', n: 204, vi: 'Không bệnh, lợi tối thượng,\nBiết đủ, tiền tối thượng,\nThành tín đối với nhau,\nLà bà con tối thượng.\nNiết-bàn, lạc tối thượng.', en: 'Health is the greatest of gifts, contentedness the best riches; trust is the best of relationships, Nirvana the highest happiness.' },
  { c: 'XV', n: 205, vi: 'Đã nếm vị độc cư,\nĐược hưởng vị nhàn tịnh,\nKhông sợ hãi, không ác,\nNếm được vị pháp hỷ.', en: 'He who has tasted the sweetness of solitude and tranquillity, is free from fear and free from sin, while he tastes the sweetness of drinking in the law.' },
  { c: 'XV', n: 206, vi: 'Lành thay, thấy thánh nhân,\nSống chung thường hưởng lạc.\nKhông thấy những người ngu,\nThường thường được an lạc.', en: 'The sight of the elect (Arya) is good, to live with them is always happiness; if a man does not see fools, he will be truly happy.' },
  { c: 'XV', n: 207, vi: 'Sống chung với người ngu,\nLâu dài bị lo buồn.  \nKhổ thay gần người ngu,\nNhư thường sống kẻ thù.\nVui thay, gần người trí,\nNhư chung sống bà con.', en: 'He who walks in the company of fools suffers a long way; company with fools, as with an enemy, is always painful; company with the wise is pleasure, like meeting with kinsfolk.' },
  { c: 'XV', n: 208, vi: 'Do vậy :\nBậc hiền sĩ, trí tuệ\nBậc nghe nhiều, trì giới,\nBậc tự chế, Thánh nhân;\nHãy gần gũi, thân cận\nThiện nhân, trí giả ấy,\nNhư trăng theo đường sao.', en: 'Therefore, one ought to follow the wise, the intelligent, the learned, the much enduring, the dutiful, the elect; one ought to follow a good and wise man, as the moon follows the path of the stars.' },
  { c: 'XVI', n: 209, vi: 'Tự chuyên, không đáng chuyên\nKhông chuyên, việc đáng chuyên.\nBỏ đích, theo hỷ ái,\nGanh tị bậc tự chuyên.', en: 'He who gives himself to vanity, and does not give himself to meditation, forgetting the real aim (of life) and grasping at pleasure, will in time envy him who has exerted himself in meditation.' },
  { c: 'XVI', n: 210, vi: 'Chớ gần gũi người yêu,\nTrọn đời xa kẻ ghét.\nYêu không gặp là khổ,\nOán phải gặp cũng đau.', en: 'Let no man ever look for what is pleasant, or what is unpleasant. Not to see what is pleasant is pain, and it is pain to see what is unpleasant.' },
  { c: 'XVI', n: 211, vi: 'Do vậy chớ yêu ai,\nÁi biệt ly là ác;\nNhững ai không yêu ghét,\nKhông thể có buộc ràng.', en: 'Let, therefore, no man love anything; loss of the beloved is evil. Those who love nothing and hate nothing, have no fetters.' },
  { c: 'XVI', n: 212, vi: 'Do ái sinh sầu ưu,\nDo ái sinh sợ hãi,\nAi thoát khỏi tham ái,\nKhông sầu, đâu sợ hãi ?', en: 'From pleasure comes grief, from pleasure comes fear; he who is free from pleasure knows neither grief nor fear.' },
  { c: 'XVI', n: 213, vi: 'Ái luyến sinh sầu ưu,\nÁi luyến sinh sợ hãi.\nAi giải thoát ái luyến\nKhông sầu, đâu sợ hãi ?', en: 'From affection comes grief, from affection comes fear; he who is free from affection knows neither grief nor fear.' },
  { c: 'XVI', n: 214, vi: 'Hỷ ái sinh sầu ưu,\nHỷ ái sinh sợ hãi.\nAi giải thoát hỷ ái,\nKhông sầu, đâu sợ hãi ?', en: 'From lust comes grief, from lust comes fear; he who is free from lust knows neither grief nor fear.' },
  { c: 'XVI', n: 215, vi: 'Dục ái sinh sầu ưu,\nDục ái sinh sợ hãi,\nAi thoát khỏi dục ái,\nKhông sầu, đâu sợ hãi ?', en: 'From love comes grief, from love comes fear; he who is free from love knows neither grief nor fear.' },
  { c: 'XVI', n: 216, vi: 'Tham ái sinh sầu ưu,\nTham ái sinh sợ hãi.\nAi thoát khỏi tham ái,\nKhông sầu, đâu sợ hãi', en: 'From greed comes grief, from greed comes fear; he who is free from greed knows neither grief nor fear.' },
  { c: 'XVI', n: 217, vi: 'Đủ giới đức, chánh kiến;\nTrú pháp, chứng chân lý,\nTự làm công việc mình,\nĐược quần chúng ái kính.', en: 'He who possesses virtue and intelligence, who is just, speaks the truth, and does what is his own business, him the world will hold dear.' },
  { c: 'XVI', n: 218, vi: 'Ước vọng pháp ly ngôn\nÝ cảm xúc thượng quả\nTâm thoát ly ác dục,\nXứng gọi bậc Thượng lưu.', en: 'He in whom a desire for the Ineffable (Nirvana) has sprung up, who is satisfied in his mind, and whose thoughts are not bewildered by love, he is called urdhvamsrotas (carried upwards by the stream).' },
  { c: 'XVI', n: 219, vi: 'Khách lâu ngày ly hương,\nAn toàn từ xa về,\nBà con cùng thân hữu,\nHân hoan đón chào mừng.', en: 'Kinsmen, friends, and lovers salute a man who has been long away, and returns safe from afar.' },
  { c: 'XVI', n: 220, vi: 'Cũng vậy các phước nghiệp,\nĐón chào người làm lành,\nĐời này đến đời kia.\nNhư thân nhân, đón chào.', en: 'In like manner his good works receive him who has done good, and has gone from this world to the other;--as kinsmen receive a friend on his return.' },
  { c: 'XVII', n: 221, vi: 'Bỏ phẫn nộ, ly mạn,\nVượt qua mọi kiết sử,\nKhông chấp trước danh sắc.\nKhổ không theo vô sản', en: 'Let a man leave anger, let him forsake pride, let him overcome all bondage! No sufferings befall the man who is not attached to name and form, and who calls nothing his own.' },
  { c: 'XVII', n: 222, vi: 'Ai chận được phẫn nộ,\nNhư dừng xe đang lăn,\nTa gọi người đánh xe,\nKẻ khác, cầm cương hờ.', en: 'He who holds back rising anger like a rolling chariot, him I call a real driver; other people are but holding the reins.' },
  { c: 'XVII', n: 223, vi: 'Lấy không giận thắng giận,\nLấy thiện thắng không thiện,\nLấy thí thắng xan tham,\nLấy chơn thắng hư ngụy.', en: 'Let a man overcome anger by love, let him overcome evil by good; let him overcome the greedy by liberality, the liar by truth!' },
  { c: 'XVII', n: 224, vi: 'Nơi thật, không phẫn nộ,\nCủa ít, thí người xin,\nNhờ ba việc lành này,\nNgười đến gần thiên giới.', en: 'Speak the truth, do not yield to anger; give, if thou art asked for little; by these three steps thou wilt go near the gods.' },
  { c: 'XVII', n: 225, vi: 'Bậc hiền không hại ai,\nThân thường được chế ngự,\nĐạt được cảnh bất tử,\nĐến đây, không ưu sầu.', en: 'The sages who injure nobody, and who always control their body, they will go to the unchangeable place (Nirvana), where, if they have gone, they will suffer no more.' },
  { c: 'XVII', n: 226, vi: 'Những người thường giác tỉnh,\nNgày đêm siêng tu học,\nChuyên tâm hướng Niết-bàn,\nMọi lậu hoặc được tiêu.', en: 'Those who are ever watchful, who study day and night, and who strive after Nirvana, their passions will come to an end.' },
  { c: 'XVII', n: 227, vi: 'A-tu-la, nên biết,\nXưa vậy, nay cũng vậy,\nNgồi im bị người chê,\nNói nhiều, bị người chê.\nNói vừa phải, bị chê.\nLàm người không bị chê,\nThật khó tìm ở đời.', en: 'This is an old saying, O Atula, this is not only of to-day: `They blame him who sits silent, they blame him who speaks much, they also blame him who says little; there is no one on earth who is not blamed.\'' },
  { c: 'XVII', n: 228, vi: 'Xưa, vị lai, và nay,\nĐâu có sự kiện này,\nNgười hoàn toàn bị chê,\nNgười trọn vẹn được khen.', en: 'There never was, there never will be, nor is there now, a man who is always blamed, or a man who is always praised.' },
  { c: 'XVII', n: 229, vi: 'Sáng sáng, thẩm xét kỹ.\nBậc có trí tán thán.\nBậc trí không tỳ vết,\nĐầy đủ giới định tuệ.', en: 'But he whom those who discriminate praise continually day after day, as without blemish, wise, rich in knowledge and virtue, who would dare to blame him, like a coin made of gold from the Gambu river? Even the gods praise him, he is praised even by Brahman.' },
  { c: 'XVII', n: 230, vi: 'Hạnh sáng như vàng ròng,\nAi dám chê vị ấy ?\nChư Thiên phải khen thưởng,\nPhạm Thiên cũng tán dương.', en: 'But he whom those who discriminate praise continually day after day, as without blemish, wise, rich in knowledge and virtue, who would dare to blame him, like a coin made of gold from the Gambu river? Even the gods praise him, he is praised even by Brahman.' },
  { c: 'XVII', n: 231, vi: 'Giữ thân đừng phẫn nộ,\nPhòng thân khéo bảo vệ,\nTừ bỏ thân làm ác,\nVới thân làm hạnh lành.', en: 'Beware of bodily anger, and control thy body! Leave the sins of the body, and with thy body practise virtue!' },
  { c: 'XVII', n: 232, vi: 'Giữ lời đừng phẫn nộ,\nPhòng lời, khéo bảo vệ,\nTừ bỏ lời thô ác,\nVới lời, nói điều lành.', en: 'Beware of the anger of the tongue, and control thy tongue! Leave the sins of the tongue, and practise virtue with thy tongue!' },
  { c: 'XVII', n: 233, vi: 'Giữ ý đừng phẫn nộ,\nPhòng ý, khéo bảo vệ,\nTừ bỏ ý nghĩ ác,\nVới ý, nghĩ hạnh lành.', en: 'Beware of the anger of the mind, and control thy mind! Leave the sins of the mind, and practise virtue with thy mind!' },
  { c: 'XVII', n: 234, vi: 'Bậc trí bảo vệ thân,\nBảo vệ luôn lời nói\nBảo vệ cả tâm tư,\nBa nghiệp khéo bảo vệ.', en: 'The wise who control their body, who control their tongue, the wise who control their mind, are indeed well controlled.' },
  { c: 'XVIII', n: 235, vi: 'Người nay giống lá héo,\nDiêm sứ đang chờ Người,\nNgười đứng trước cửa chết,\nĐường trường thiếu tư lương.', en: 'Thou art now like a sear leaf, the messengers of death (Yama) have come near to thee; thou standest at the door of thy departure, and thou hast no provision for thy journey.' },
  { c: 'XVIII', n: 236, vi: 'Hãy tự làm hòn đảo,\nTinh cần gấp, sáng suốt.\nTrừ cấu uế, thanh tịnh,\nĐến Thánh địa chư Thiên.', en: 'Make thyself an island, work hard, be wise! When thy impurities are blown away, and thou art free from guilt, thou wilt enter into the heavenly world of the elect (Ariya).' },
  { c: 'XVIII', n: 237, vi: 'Đời ngươi nay sắp tàn,\nTiến gần đến Diêm Vương.\nGiữa đường không nơi nghỉ,\nĐường trường thiếu tư lương.', en: 'Thy life has come to an end, thou art come near to death (Yama), there is no resting-place for thee on the road, and thou hast no provision for thy journey.' },
  { c: 'XVIII', n: 238, vi: 'Hãy tự làm hòn đảo,\nTinh cần gấp sáng suốt.\nTrừ cấu uế, thanh tịnh,\nChẳng trở lại sanh già.', en: 'Make thyself an island, work hard, be wise! When thy impurities are blown away, and thou art free from guilt, thou wilt not enter again into birth and decay.' },
  { c: 'XVIII', n: 239, vi: 'Bậc trí theo tuần tự.\nTừng sát na trừ dần.\nNhư thợ vàng lọc bụi\nTrừ cấu uế nơi mình.', en: 'Let a wise man blow off the impurities of his self, as a smith blows off the impurities of silver one by one, little by little, and from time to time.' },
  { c: 'XVIII', n: 240, vi: 'Như sét từ sắt sanh,\nSắt sanh lại ăn sắt,\nCũng vậy, quá lợi dưỡng\nTự nghiệp dẫn cõi ác.', en: 'As the impurity which springs from the iron, when it springs from it, destroys it; thus do a transgressor\'s own works lead him to the evil path.' },
  { c: 'XVIII', n: 241, vi: 'Không tụng làm nhớp kinh,\nKhông đứng dậy, bẩn nhà,\nBiếng nhác làm nhơ sắc,\nPhóng dật uế người canh.', en: 'The taint of prayers is non-repetition; the taint of houses, non-repair; the taint of the body is sloth; the taint of a watchman, thoughtlessness.' },
  { c: 'XVIII', n: 242, vi: 'Tà hạnh nhơ đàn bà,\nXan tham nhớp kẻ thí,\nÁc pháp là vết nhơ,\nĐời này và đời sau.', en: 'Bad conduct is the taint of woman, greediness the taint of a benefactor; tainted are all evil ways in this world and in the next.' },
  { c: 'XVIII', n: 243, vi: 'Trong hàng cấu uế ấy,\nVô minh, nhơ tối thượng,\nĐoạn nhơ ấy, Tỷ kheo,\nThành bậc không uế nhiễm.', en: 'But there is a taint worse than all taints,--ignorance is the greatest taint. O mendicants! throw off that taint, and become taintless!' },
  { c: 'XVIII', n: 244, vi: 'Dễ thay, sống không hổ\nSống lỗ mãng như quạ,\nSống công kích huênh hoang,\nSống liều lĩnh, nhiễm ô.', en: 'Life is easy to live for a man who is without shame, a crow hero, a mischief-maker, an insulting, bold, and wretched fellow.' },
  { c: 'XVIII', n: 245, vi: 'Khó thay, sống xấu hổ,\nThường thường cầu thanh tịnh.\nSống vô tư, khiêm tốn,\nTrong sạch và sáng suốt.', en: 'But life is hard to live for a modest man, who always looks for what is pure, who is disinterested, quiet, spotless, and intelligent.' },
  { c: 'XVIII', n: 246, vi: 'Ai ở đời sát sinh,\nNói láo không chân thật,\nỞ đời lấy không cho,\nQua lại với vợ người.', en: 'He who destroys life, who speaks untruth, who in this world takes what is not given him, who goes to another man\'s wife;' },
  { c: 'XVIII', n: 247, vi: 'Uống rượu men, rượu nấu,\nNgười sống đam mê vậy,\nChính ngay tại đời này,\nTự đào bới gốc mình.', en: 'And the man who gives himself to drinking intoxicating liquors, he, even in this world, digs up his own root.' },
  { c: 'XVIII', n: 248, vi: 'Vậy người, hãy nên biết,\nKhông chế ngự là ác.\nChớ để tham phi pháp,\nLàm người đau khổ dài.', en: 'O man, know this, that the unrestrained are in a bad state; take care that greediness and vice do not bring thee to grief for a long time!' },
  { c: 'XVIII', n: 249, vi: 'Do tín tâm, hỷ tâm\nLoài người mới bố thí.\nỞ đây ai bất mãn\nNgười khác được ăn uống,\nNgười ấy ngày hoặc đêm,\nKhông đạt được tâm định ?', en: 'The world gives according to their faith or according to their pleasure: if a man frets about the food and the drink given to others, he will find no rest either by day or by night.' },
  { c: 'XVIII', n: 250, vi: 'Ai cắt được, phá được,\nTận gốc nhổ tâm ấy.\nNgười ấy ngày hoặc đêm,\nĐạt được tâm thiền định.', en: 'He in whom that feeling is destroyed, and taken out with the very root, finds rest by day and by night.' },
  { c: 'XVIII', n: 251, vi: 'Lửa nào bằng lửa tham !\nChấp nào bằng sân hận !\nLưới nào bằng lưới si !\nSông nào bằng sông ái !', en: 'There is no fire like passion, there is no shark like hatred, there is no snare like folly, there is no torrent like greed.' },
  { c: 'XVIII', n: 252, vi: 'Dễ thay thấy lỗi người,\nLỗi mình thấy mới khó.\nLỗi người, ta phanh tìm,\nNhư sàng trấu trong gạo,\nCòn lỗi mình, che đậy,\nNhư kẻ gian dấu bài.', en: 'The fault of others is easily perceived, but that of oneself is difficult to perceive; a man winnows his neighbour\'s faults like chaff, but his own fault he hides, as a cheat hides the bad die from the gambler.' },
  { c: 'XVIII', n: 253, vi: 'Ai thấy lỗi của người,\nThường sanh lòng chỉ trích,\nNgười ấy lậu hoặc tăng,\nRất xa lậu hoặc diệt.', en: 'If a man looks after the faults of others, and is always inclined to be offended, his own passions will grow, and he is far from the destruction of passions.' },
  { c: 'XVIII', n: 254, vi: 'Hư không, không dấu chân,\nNgoài đây, không Sa-môn,\nChúng sanh thích hý luận,\nNhư Lai, hý luận trừ.', en: 'There is no path through the air, a man is not a Samana by outward acts. The world delights in vanity, the Tathagatas (the Buddhas) are free from vanity.' },
  { c: 'XVIII', n: 255, vi: 'Hư không, không dấu chân,\nNgoài đây, không Sa-môn.\nCác hành không thường trú,\nChư Phật không giao động.', en: 'There is no path through the air, a man is not a Samana by outward acts. No creatures are eternal; but the awakened (Buddha) are never shaken.' },
  { c: 'XIX', n: 256, vi: 'Người đâu phải pháp trụ,\nXử sự quá chuyên chế,\nBậc trí cần phân biệt\nCả hai chánh và tà !', en: 'A man is not just if he carries a matter by violence; no, he who distinguishes both right and wrong,'},
  { c: 'XIX', n: 257, vi: 'Không chuyên chế, đúng pháp,\nCông bằng, dắt dẫn người,\nBậc trí sống đúng pháp,\nThật xứng danh pháp trụ.', en: 'who is learned and leads others, not by violence, but by law and equity, and who is guarded by the law and intelligent, he is called just.' },
  { c: 'XIX', n: 258, vi: 'Không phải vì nói nhiều,\nMới xứng danh bậc trí.\nAn ổn, không oán sợ.\nThật đáng gọi bậc trí.', en: 'A man is not learned because he talks much; he who is patient, free from hatred and fear, he is called learned.' },
  { c: 'XIX', n: 259, vi: 'Không phải vì nói nhiều,\nMới xứng danh trì pháp,\nNhững ai tuy nghe ít,\nNhưng thân hành đúng pháp,\nKhông phóng túng Chánh pháp,\nMới xứng danh trì pháp.', en: 'A man is not a supporter of the law because he talks much; even if a man has learnt little, but sees the law bodily, he is a supporter of the law, a man who never neglects the law.' },
  { c: 'XIX', n: 260, vi: 'Không phải là trưởng lão,\nNếu cho có bạc đầu.\nNgười chỉ tuổi tác cao,\nĐược gọi là Lão ngu.', en: 'A man is not an elder because his head is grey; his age may be ripe, but he is called \'Old-in-vain.\'' },
  { c: 'XIX', n: 261, vi: 'Ai chân thật, đúng pháp,\nKhông hại, biết chế phục,\nBậc trí không cấu uế,\nMới xứng danh Trưởng Lão.', en: 'He in whom there is truth, virtue, love, restraint, moderation, he who is free from impurity and is wise, he is called an elder.' },
  { c: 'XIX', n: 262, vi: 'Không phải nói lưu loát,\nKhông phải sắc mặt đẹp,\nThành được người lương thiện,\nNếu ganh, tham, dối trá.', en: 'An envious greedy, dishonest man does not become respectable by means of much talking only, or by the beauty of his complexion.' },
  { c: 'XIX', n: 263, vi: 'Ai cắt được, phá được\nTận gốc nhổ tâm ấy\nNgười trí ấy diệt sân,\nĐược gọi người hiền thiện.', en: 'He in whom all this is destroyed, and taken out with the very root, he, when freed from hatred and wise, is called respectable.' },
  { c: 'XIX', n: 264, vi: 'Đầu trọc, không Sa-môn\nNếu phóng túng, nói láo.\nAi còn đầy dục tham,\nSao được gọi Sa-môn ?', en: 'Not by tonsure does an undisciplined man who speaks falsehood become a Samana; can a man be a Samana who is still held captive by desire and greediness?' },
  { c: 'XIX', n: 265, vi: 'Ai lắng dịu hoàn toàn,\nCác điều ác lớn nhỏ,\nVì lắng dịu ác pháp,\nĐược gọi là Sa-môn.', en: 'He who always quiets the evil, whether small or large, he is called a Samana (a quiet man), because he has quieted all evil.' },
  { c: 'XIX', n: 266, vi: 'Chỉ khất thực nhờ người,\nĐâu phải là Tỷ-kheo !\nPhải theo pháp toàn diện,\nKhất sĩ không, không đủ.', en: 'A man is not a mendicant (Bhikshu) simply because he asks others for alms; he who adopts the whole law is a Bhikshu, not he who only begs.' },
  { c: 'XIX', n: 267, vi: 'Ai vượt qua thiện ác,\nChuyên sống đời Phạm Hạnh,\nSống thẩm sát ở đời,\nMới xứng danh Tỷ-kheo.', en: 'He who is above good and evil, who is chaste, who with knowledge passes through the world, he indeed is called a Bhikshu.' },
  { c: 'XIX', n: 268, vi: 'Im lặng nhưng ngu si,\nĐâu được gọi ẩn sĩ ?\nNhư người cầm cán cân,\nBậc trí chọn điều lành.', en: 'A man is not a Muni because he observes silence (mona), if he is foolish and ignorant; but the wise who, taking the balance, chooses the good and avoids evil,' },
  { c: 'XIX', n: 269, vi: 'Từ bỏ các ác pháp,\nMới thật là ẩn sĩ.\nAi thật hiểu hai đời\nMới được gọi ẩn sĩ.', en: 'he is a Muni, and is a Muni thereby; he who in this world weighs both sides is called a Muni.' },
  { c: 'XIX', n: 270, vi: 'Còn sát hại sinh linh,\nĐâu được gọi Hiền thánh.\nKhông hại mọi hữu tình,\nMới được gọi Hiền Thánh.', en: 'A man is not an elect (Ariya) because he injures living creatures; because he has pity on all living creatures, therefore is a man called Ariya.' },
  { c: 'XIX', n: 271, vi: 'Chẳng phải chỉ giới cấm\nCũng không phải học nhiều,\nChẳng phải chứng thiền định,\nSống thanh vắng một mình.', en: 'Not only by discipline and vows, not only by much learning, not by entering into a trance, not by sleeping alone, do I earn the happiness of release which no worldling can know.' },
  { c: 'XIX', n: 272, vi: 'Ta hưởng an ổn lạc,\nPhàm phu chưa hưởng được.\nTỷ kheo, chớ tự tín\nKhi lậu hoặc chưa diệt.', en: 'Bhikshu, be not confident as long as thou hast not attained the extinction of desires.' },
  { c: 'XX', n: 273, vi: 'Tám ngành, đường thù thắng,\nBốn câu, lý thù thắng.\nLy tham, pháp thù thắng,\nGiữa các loài hai chân,\nPháp nhãn, người thù thắng.', en: 'The best of ways is the eightfold; the best of truths the four words; the best of virtues passionlessness; the best of men he who has eyes to see.' },
