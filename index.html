<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kinh Pháp Cú — Đọc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,440;9..144,560;9..144,620&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-night: #10152a; --bg-panel: #1a2238; --bg-panel-raised: #212b46;
    --water: #2a3a52; --flame: #e3a857; --flame-dim: #b8823f;
    --parchment: #ece4d3; --muted: #8f99b3; --jade: #6ea886;
    --border-soft: rgba(236, 228, 211, 0.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100vh; background: var(--bg-night); color: var(--parchment); font-family: 'Be Vietnam Pro', -apple-system, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; padding: 28px 16px 56px; }
  .wrap { width: 100%; max-width: 620px; }
  .lamp { display: block; margin: 0 auto 12px; }
  @media (prefers-reduced-motion: no-preference) {
    .lamp-flame { animation: flicker 3.4s ease-in-out infinite; transform-origin: 50% 100%; }
  }
  @keyframes flicker {
    0%, 100% { opacity: 1; transform: scaleY(1); }
    45% { opacity: 0.86; transform: scaleY(0.94) scaleX(1.03); }
    70% { opacity: 0.96; transform: scaleY(1.03); }
  }
  h1 { font-family: 'Fraunces', serif; font-weight: 560; font-size: clamp(1.4rem, 5vw, 1.85rem); text-align: center; margin: 0 0 4px; letter-spacing: -0.01em; }
  .subtitle { text-align: center; color: var(--muted); font-size: 0.88rem; margin: 0 0 20px; line-height: 1.5; }
  
  .chapter-select-wrapper { text-align: center; margin-bottom: 26px; }
  .chapter-dropdown { 
    appearance: none; 
    background: var(--bg-panel); 
    border: 1px solid var(--border-soft); 
    color: var(--flame); 
    padding: 10px 36px 10px 16px; 
    border-radius: 8px; 
    font-family: 'Fraunces', serif; 
    font-size: 1.05rem; 
    cursor: pointer;
    background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23e3a857%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
    background-repeat: no-repeat;
    background-position: right 12px top 50%;
    background-size: 12px auto;
    max-width: 100%;
  }
  .chapter-dropdown:focus { outline: 2px solid var(--flame); outline-offset: 2px; }
  
  .chapter-title { font-family: 'Fraunces', serif; font-weight: 600; font-size: 1.25rem; text-align: center; margin: 0 0 2px; color: var(--parchment); }
  .chapter-range { text-align: center; color: #ffffff; font-size: 0.9rem; margin: 0 0 22px; }
  .verse-card { background: #000000; border: 1px solid var(--border-soft); border-radius: 22px 6px 22px 6px; padding: 22px 24px; margin-bottom: 14px; }
  .verse-num { font-size: 0.85rem; color: var(--flame-dim); margin-bottom: 8px; font-weight: 500; }
  .verse-vi { font-family: 'Fraunces', serif; font-weight: 500; font-size: 1.35rem; line-height: 1.8; white-space: pre-line; margin: 0; color: #ffffff; }
  .verse-toggle { display: block; margin-top: 14px; padding: 9px 0; width: 100%; background: transparent; border: none; border-top: 1px solid var(--border-soft); color: var(--jade); font-family: inherit; font-size: 0.9rem; font-weight: 500; cursor: pointer; text-align: left; }
  .verse-toggle:hover { color: var(--flame); }
  .verse-en { margin-top: 12px; padding-top: 2px; color: #ffffff; font-size: 1.05rem; line-height: 1.6; font-style: italic; white-space: pre-line; }
</style>
</head>
<body>
<div class="wrap">
  <svg class="lamp" width="32" height="32" viewBox="0 0 34 34" fill="none">
    <path class="lamp-flame" d="M17 4C13 10 11 14 11 18.5C11 23.5 13.5 26 17 26C20.5 26 23 23.5 23 18.5C23 14 21 10 17 4Z" fill="#e3a857"/>
    <ellipse cx="17" cy="20" rx="3.4" ry="4.4" fill="#10152a" opacity="0.55"/>
    <rect x="10" y="27" width="14" height="2.4" rx="1.2" fill="#8f99b3"/>
    <rect x="13" y="30" width="8" height="2" rx="1" fill="#8f99b3" opacity="0.7"/>
  </svg>
  <h1>Kinh Pháp Cú</h1>
  <p class="subtitle">Bản dịch thơ — HT. Thích Minh Châu. Chạm "Xem tiếng Anh" (F. Max Müller) để đối chiếu.</p>
  <div id="app"><p class="subtitle">Đang tải…</p></div>
</div>
<script>
(function () {
  var STORAGE_KEY = 'phapcu-doc-last-chapter';
  var CHAPTERS = [];
  var VERSES = [];
  var activeChapter = 'I';
  var expanded = {};

  function escapeHtml(s) {
    return (s || '').replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function loadLastChapter() {
    try {
      var id = localStorage.getItem(STORAGE_KEY);
      if (id && CHAPTERS.some(function (ch) { return ch.id === id; })) return id;
    } catch (e) {}
    return CHAPTERS.length ? CHAPTERS[0].id : 'I';
  }

  function saveLastChapter(id) {
    try { localStorage.setItem(STORAGE_KEY, id); } catch (e) {}
  }

  function selectChapter(id) {
    activeChapter = id;
    expanded = {};
    saveLastChapter(id);
    render();
  }

  function toggleVerse(n) {
    expanded[n] = !expanded[n];
    render();
  }

  function render() {
    var app = document.getElementById('app');

    var chapterSelect = '<div class="chapter-select-wrapper"><select id="chapter-select" class="chapter-dropdown">';
    CHAPTERS.forEach(function (ch) {
      var isSelected = ch.id === activeChapter ? ' selected' : '';
      chapterSelect += '<option value="' + ch.id + '"' + isSelected + '>' + escapeHtml(ch.title) + '</option>';
    });
    chapterSelect += '</select></div>';

    var chapterMeta = CHAPTERS.filter(function (ch) { return ch.id === activeChapter; })[0];
    var header = '<div class="chapter-title">' + escapeHtml(chapterMeta.title) + '</div>' +
      '<div class="chapter-range">' + escapeHtml(chapterMeta.range) + '</div>';

    var verses = VERSES.filter(function (v) { return v.chapter === activeChapter; });
    var cards = '';

    if (verses.length === 0) {
      cards = '<div class="verse-card" style="text-align:center; color: var(--muted);"><p>Chưa có dữ liệu cho phẩm này.</p></div>';
    } else {
      cards = verses.map(function (v) {
        var isOpen = !!expanded[v.number];
        return '<div class="verse-card">' +
          '<div class="verse-num">câu ' + v.number + '</div>' +
          '<p class="verse-vi">' + escapeHtml(v.vi) + '</p>' +
          '<button class="verse-toggle" data-verse="' + v.number + '" aria-expanded="' + isOpen + '">' +
            (isOpen ? 'Ẩn tiếng Anh' : 'Xem tiếng Anh') + '</button>' +
          (isOpen ? '<div class="verse-en" lang="en">' + escapeHtml(v.en) + '</div>' : '') +
          '</div>';
      }).join('');
    }

    app.innerHTML = chapterSelect + header + cards;

    document.getElementById('chapter-select').addEventListener('change', function (e) {
      selectChapter(e.target.value);
    });

    Array.prototype.forEach.call(app.querySelectorAll('.verse-toggle'), function (btn) {
      btn.addEventListener('click', function () { toggleVerse(parseInt(btn.getAttribute('data-verse'), 10)); });
    });
  }

  async function init() {
    var app = document.getElementById('app');
    try {
      var res = await fetch('verses.json');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var data = await res.json();
      CHAPTERS = data.chapters;
      VERSES = data.verses;
    } catch (e) {
      app.innerHTML = '<div class="verse-card" style="text-align:center; color: var(--muted);">' +
        '<p>Không tải được dữ liệu (verses.json).</p>' +
        '<p>Nếu bạn mở tệp trực tiếp từ máy, hãy chạy <code>python3 -m http.server</code> trong thư mục này rồi mở <code>http://localhost:8000</code>.</p></div>';
      return;
    }
    activeChapter = loadLastChapter();
    render();
  }

  init();
})();
</script>
</body>
</html>
