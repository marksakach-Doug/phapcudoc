  { c: 'XX', n: 274, vi: 'Đường này, không đường khác\nĐưa đến kiến thanh tịnh.\nNếu Người theo đường này,\nMa quân sẽ mê loạn.', en: 'This is the way, there is no other that leads to the purifying of intelligence. Go on this way! Everything else is the deceit of Mara (the tempter).' },
  { c: 'XX', n: 275, vi: 'Nếu Người theo đường này,\nĐau khổ được đoạn tận.\nTa dạy Người con đường.\nVới trí, gai chướng diệt.', en: 'If you go on this way, you will make an end of pain! The way was preached by me, when I had understood the removal of the thorns (in the flesh).' },
  { c: 'XX', n: 276, vi: 'Người hãy nhiệt tình làm,\nNhư Lai chỉ thuyết dạy.\nNgười hành trì thiền định\nThoát trói buộc Ác ma.', en: 'You yourself must make an effort. The Tathagatas (Buddhas) are only preachers. The thoughtful who enter the way are freed from the bondage of Mara.' },
  { c: 'XX', n: 277, vi: 'Tất cả hành vô thường\nVới Tuệ, quán thấy vậy\nĐau khổ được nhàm chán;\nChính con đường thanh tịnh.', en: '`All created things perish,\' he who knows and sees this becomes passive in pain; this is the way to purity.' },
  { c: 'XX', n: 278, vi: 'Tất cả hành khổ đau\nVới Tuệ quán thấy vậy,\nĐau khổ được nhàm chán;\nChính con đường thanh tịnh.', en: '`All created things are grief and pain,\' he who knows and sees this becomes passive in pain; this is the way that leads to purity.' },
  { c: 'XX', n: 279, vi: 'Tất cả pháp vô ngã,\nVới Tuệ quán thấy vậy,\nĐau khổ được nhàm chán\nChính con đường thanh tịnh.', en: '`All forms are unreal,\' he who knows and sees this becomes passive in pain; this is the way that leads to purity.' },
  { c: 'XX', n: 280, vi: 'Khi cần, không nỗ lực,\nTuy trẻ mạnh, nhưng lười\nChí nhu nhược, biếng nhác.\nVới trí tuệ thụ động,\nSao tìm được chánh đạo ?', en: 'He who does not rouse himself when it is time to rise, who, though young and strong, is full of sloth, whose will and thought are weak, that lazy and idle man will never find the way to knowledge.' },
  { c: 'XX', n: 281, vi: 'Lời nói được thận trọng,\nTâm tư khéo hộ phòng,\nThân chớ làm điều ác,\nHãy giữ ba nghiệp tịnh,\nChứng đạo Thánh nhân dạy.', en: 'Watching his speech, well restrained in mind, let a man never commit any wrong with his body! Let a man but keep these three roads of action clear, and he will achieve the way which is taught by the wise.' },
  { c: 'XX', n: 282, vi: 'Tu thiền, trí huệ sanh,\nBỏ Thiền, trí tuệ diệt.\nBiết con đường hai ngả\nĐưa đến hữu, phi hữu,\nHãy tự mình nỗ lực,\nKhiến trí tuệ tăng trưởng.', en: 'Through zeal knowledge is gotten, through lack of zeal knowledge is lost; let a man who knows this double path of gain and loss thus place himself that knowledge may grow.' },
  { c: 'XX', n: 283, vi: 'Đốn rừng không đốn cây\nTừ rừng, sinh sợ hãi;\nĐốn rừng và ái dục,\nTỷ-kheo hãy tịch tịnh.', en: 'Cut down the whole forest (of lust), not a tree only! Danger comes out of the forest (of lust). When you have cut down both the forest (of lust) and its undergrowth, then, Bhikshus, you will be rid of the forest and free!' },
  { c: 'XX', n: 284, vi: 'Khi nào chưa cắt tiệt,\nÁi dục giữa gái trai,\nTâm ý vẫn buộc ràng,\nNhư bò con vú mẹ.', en: 'So long as the love of man towards women, even the smallest, is not destroyed, so long is his mind in bondage, as the calf that drinks milk is to its mother.' },
  { c: 'XX', n: 285, vi: 'Tự cắt giây ái dục,\nNhư tay bẻ sen thu,\nHãy tu đạo tịch tịnh,\nNiết-bàn, Thiện Thệ dạy.', en: 'Cut out the love of self, like an autumn lotus, with thy hand! Cherish the road of peace. Nirvana has been shown by Sugata (Buddha).' },
  { c: 'XX', n: 286, vi: 'Mùa mưa ta ở đây\nĐông, hạ cũng ở đây,\nNgười ngu tâm tưởng vậy,\nKhông tự giác hiểm nguy.', en: '`Here I shall dwell in the rain, here in winter and summer,\' thus the fool meditates, and does not think of his death.' },
  { c: 'XX', n: 287, vi: 'Người tâm ý đắm say\nCon cái và súc vật,\nTử thần bắt người ấy,\nNhư lụt trôi làng ngủ.', en: 'Death comes and carries off that man, praised for his children and flocks, his mind distracted, as a flood carries off a sleeping village.' },
  { c: 'XX', n: 288, vi: 'Một khi Tử thần đến,\nKhông có con che chở,\nKhông cha, không bà con,\nKhông thân thích che chở.', en: 'Sons are no help, nor a father, nor relations; there is no help from kinsfolk for one whom death has seized.' },
  { c: 'XX', n: 289, vi: 'Biết rõ ý nghĩa này,\nBậc trí lo trì giới,\nMau lẹ làm thanh tịnh,\nCon đường đến Niết-bàn.\n ', en: 'A wise and good man who knows the meaning of this, should quickly clear the way that leads to Nirvana.' },
  { c: 'XXI', n: 290, vi: 'Nhờ từ bỏ lạc nhỏ,\nThấy được lạc lớn hơn,\nBậc trí bỏ lạc nhỏ,\nThấy được lạc lớn hơn.', en: 'If by leaving a small pleasure one sees a great pleasure, let a wise man leave the small pleasure, and look to the great.' },
  { c: 'XXI', n: 291, vi: 'Gieo khổ đau cho người,\nMong cầu lạc cho mình,\nBị hận thù buộc ràng\nKhông sao thoát hận thù.', en: 'He who, by causing pain to others, wishes to obtain pleasure for himself, he, entangled in the bonds of hatred, will never be free from hatred.' },
  { c: 'XXI', n: 292, vi: 'Việc đáng làm, không làm,\nKhông đáng làm, lại làm,\nNgười ngạo mạn, phóng dật,\nLậu hoặc ắt tăng trưởng.', en: 'What ought to be done is neglected, what ought not to be done is done; the desires of unruly, thoughtless people are always increasing.' },
  { c: 'XXI', n: 293, vi: 'Người siêng năng cần mẫn,\nThường thường quán thân niệm,\nKhông làm việc không đáng,\nGắng làm việc đáng làm,\nNgười tư niệm giác tỉnh,\nLậu hoặc được tiêu trừ.', en: 'But they whose whole watchfulness is always directed to their body, who do not follow what ought not to be done, and who steadfastly do what ought to be done, the desires of such watchful and wise people will come to an end.' },
  { c: 'XXI', n: 294, vi: 'Sau khi giết mẹ cha,\nGiết hại Vua Sát lỵ,\nGiết vương quốc, quần thần\nVô ưu, Phạm Chí sống.', en: 'A true Brahmana goes scatheless, though he have killed father and mother, and two valiant kings, though he has destroyed a kingdom with all its subjects.' },
  { c: 'XXI', n: 295, vi: 'Sau khi giết mẹ cha,\nHai vua Bà-la-môn,\nGiết hổ tướng thứ năm\nVô ưu, Phạm Chí sống.', en: 'A true Brahmana goes scatheless, though he have killed father and mother, and two holy kings, and an eminent man besides.' },
  { c: 'XXI', n: 296, vi: 'Đệ tử Gotama,\nLuôn luôn tự tỉnh giác\nVô luận ngày hay đêm,\nTưởng Phật đà thường niệm', en: 'The disciples of Gotama (Buddha) are always well awake, and their thoughts day and night are always set on Buddha.' },
  { c: 'XXI', n: 297, vi: 'Đệ tử Gotama,\nLuôn luôn tự tỉnh giác,\nVô luận ngày hay đêm,\nTưởng Chánh pháp thường niệm.', en: 'The disciples of Gotama are always well awake, and their thoughts day and night are always set on the law.' },
  { c: 'XXI', n: 298, vi: 'Đệ tử Gotama,\nLuôn luôn tự tỉnh giác,\nVô luận ngày hay đêm,\nTưởng Tăng-già thường niệm.', en: 'The disciples of Gotama are always well awake, and their thoughts day and night are always set on the church.' },
  { c: 'XXI', n: 299, vi: 'Đệ tử Gotama,\nLuôn luôn tự tỉnh giác,\nVô luận ngày hay đêm,\nTưởng sắc thân thường niệm.', en: 'The disciples of Gotama are always well awake, and their thoughts day and night are always set on their body.' },
  { c: 'XXI', n: 300, vi: 'Đệ tử Gotama,\nLuôn luôn tự tỉnh giác,\nVô luận ngày hay đêm,\nÝ vui niềm bất hại.', en: 'The disciples of Gotama are always well awake, and their mind day and night always delights in compassion.' },
  { c: 'XXI', n: 301, vi: 'Đệ tử Gotama,\nLuôn luôn tự tỉnh giác,\nVô luận ngày hay đêm,\nÝ vui tu thiền quán.', en: 'The disciples of Gotama are always well awake, and their mind day and night always delights in meditation.' },
  { c: 'XXI', n: 302, vi: 'Vui hạnh xuất gia khó,\nTại gia sinh hoạt khó,\nSống bạn không đồng, khổ,\nTrôi lăn luân hồi, khổ,\nVậy chớ sống luân hồi,\nChớ chạy theo đau khổ.', en: 'It is hard to leave the world (to become a friar), it is hard to enjoy the world; hard is the monastery, painful are the houses; painful it is to dwell with equals (to share everything in common) and the itinerant mendicant is beset with pain. Therefore let no man be an itinerant mendicant and he will not be beset with pain.' },
  { c: 'XXI', n: 303, vi: 'Tín tâm, sống giới hạnh\nĐủ danh xưng tài sản,\nChỗ nào người ấy đến,\nChỗ ấy được cung kính.', en: 'Whatever place a faithful, virtuous, celebrated, and wealthy man chooses, there he is respected.' },
  { c: 'XXI', n: 304, vi: 'Người lành dầu ở xa\nSáng tỏ như núi tuyết,\nNgười ác dầu ở gần\nNhư tên bắn đêm đen.', en: 'Good people shine from afar, like the snowy mountains; bad people are not seen, like arrows shot by night.' },
  { c: 'XXI', n: 305, vi: 'Ai ngồi nằm một mình.\nĐộc hành không buồn chán,\nTự điều phục một mình\nSống thoải mái rừng sâu.', en: 'He alone who, without ceasing, practises the duty of sitting alone and sleeping alone, he, subduing himself, will rejoice in the destruction of all desires alone, as if living in a forest.' },
  { c: 'XXII', n: 306, vi: 'Nói láo đọa địa ngục\nCó làm nói không làm,\nCả hai chết đồng đẳng,\nLàm người, nghiệp hạ liệt.', en: 'He who says what is not, goes to hell; he also who, having done a thing, says I have not done it. After death both are equal, they are men with evil deeds in the next world.' },
  { c: 'XXII', n: 307, vi: 'Nhiều người khoác cà-sa,\nÁc hạnh không nhiếp phục.\nNgười ác, do ác hạnh,\nPhải sanh cõi địa ngục.', en: 'Many men whose shoulders are covered with the yellow gown are ill-conditioned and unrestrained; such evil-doers by their evil deeds go to hell.' },
  { c: 'XXII', n: 308, vi: 'Tốt hơn nuốt hòn sắt\nCháy đỏ như lửa hừng,\nHơn ác giới, buông lung\nĂn đồ ăn quốc độ.', en: 'Better it would be to swallow a heated iron ball, like flaring fire, than that a bad unrestrained fellow should live on the charity of the land.' },
  { c: 'XXII', n: 309, vi: 'Bốn nạn chờ đợi người,\nPhóng dật theo vợ người;\nMắc họa, ngủ không yên,\nBị chê là thứ ba,\nĐọa địa ngục, thứ bốn.', en: 'Four things does a wreckless man gain who covets his neighbour\'s wife,--a bad reputation, an uncomfortable bed, thirdly, punishment, and lastly, hell.' },
  { c: 'XXII', n: 310, vi: 'Mắc họa, đọa ác thú,\nBị hoảng sợ, ít vui.\nQuốc vương phạt trọng hình.\nVậy chớ theo vợ người.', en: 'There is bad reputation, and the evil way (to hell), there is the short pleasure of the frightened in the arms of the frightened, and the king imposes heavy punishment; therefore let no man think of his neighbour\'s wife.' },
  { c: 'XXII', n: 311, vi: 'Như cỏ sa vụng nắm,\nTất bị họa đứt tay\nHạnh Sa-môn tà vạy,\nTất bị đọa địa ngục.', en: 'As a grass-blade, if badly grasped, cuts the arm, badly-practised asceticism leads to hell.' },
  { c: 'XXII', n: 312, vi: 'Sống phóng đãng buông lung,\nTheo giới cấm ô nhiễm,\nSống Phạm hạnh đáng nghi\nSao chứng được quả lớn ?', en: 'An act carelessly performed, a broken vow, and hesitating obedience to discipline, all this brings no great reward.' },
  { c: 'XXII', n: 313, vi: 'Cần phải làm, nên làm\nLàm cùng tận khả năng\nXuất gia sống phóng đãng,\nChi tăng loạn bụi đời.', en: 'If anything is to be done, let a man do it, let him attack it vigorously! A careless pilgrim only scatters the dust of his passions more widely.' },
  { c: 'XXII', n: 314, vi: 'Ác hạnh không nên làm,\nLàm xong, chịu khổ lụy,\nThiện hạnh, ắt nên làm,\nLàm xong, không ăn năn.', en: 'An evil deed is better left undone, for a man repents of it afterwards; a good deed is better done, for having done it, one does not repent.' },
  { c: 'XXII', n: 315, vi: 'Như thành ở biên thùy,\nTrong ngoài đều phòng hộ\nCũng vậy, phòng hộ mình,\nSát-na chớ buông lung.\nGiây phút qua, sầu muộn.\nKhi rơi vào địa ngục.', en: 'Like a well-guarded frontier fort, with defences within and without, so let a man guard himself. Not a moment should escape, for they who allow the right moment to pass, suffer pain when they are in hell.' },
  { c: 'XXII', n: 316, vi: 'Không đáng hổ, lại hổ.\nViệc đáng hổ, lại không.\nDo chấp nhận tà kiến,\nChúng sanh đi ác thú.', en: 'They who are ashamed of what they ought not to be ashamed of, and are not ashamed of what they ought to be ashamed of, such men, embracing false doctrines enter the evil path.' },
  { c: 'XXII', n: 317, vi: 'Không đáng sợ, lại sợ,\nĐáng sợ, lại thấy không,\nDo chấp nhận tà kiến.\nChúng sanh đi ác thú.', en: 'They who fear when they ought not to fear, and fear not when they ought to fear, such men, embracing false doctrines, enter the evil path.' },
  { c: 'XXII', n: 318, vi: 'Không lỗi, lại thấy lỗi,\nCó lỗi, lại thấy không,\nDo chấp nhận tà kiến,\nChúng sanh đi ác thú.', en: 'They who forbid when there is nothing to be forbidden, and forbid not when there is something to be forbidden, such men, embracing false doctrines, enter the evil path.' },
  { c: 'XXII', n: 319, vi: 'Có lỗi, biết có lỗi,\nKhông lỗi, biết là không,\nDo chấp nhận chánh kiến,\nChúng sanh đi cõi lành.', en: 'They who know what is forbidden as forbidden, and what is not forbidden as not forbidden, such men, embracing the true doctrine, enter the good path.' },
  { c: 'XXIII', n: 320, vi: 'Ta như voi giữa trận,\nHứng chịu cung tên rơi,\nChịu đựng mọi phỉ báng.\nÁc giới rất nhiều người.', en: 'Silently shall I endure abuse as the elephant in battle endures the arrow sent from the bow: for the world is ill-natured.' },
  { c: 'XXIII', n: 321, vi: 'Voi luyện, đưa dự hội,\nNgựa luyện, được vua cưỡi,\nNgười luyện, bậc tối thượng\nChịu đựng mọi phỉ báng.', en: 'They lead a tamed elephant to battle, the king mounts a tamed elephant; the tamed is the best among men, he who silently endures abuse.' },
  { c: 'XXIII', n: 322, vi: 'Tốt thay, con la thuần,\nThuần chủng loài ngựa Sind.\nĐại tượng, voi có ngà.\nTự điều mới tối thượng.', en: 'Mules are good, if tamed, and noble Sindhu horses, and elephants with large tusks; but he who tames himself is better still.' },
  { c: 'XXIII', n: 323, vi: 'Chẳng phải loài cưỡi ấy,\nĐưa người đến Niết-bàn,\nChỉ có người tự điều,\nĐến đích, nhờ điều phục.', en: 'For with these animals does no man reach the untrodden country (Nirvana), where a tamed man goes on a tamed animal, viz. on his own well-tamed self.' },
  { c: 'XXIII', n: 324, vi: '"Con voi tên Tài Hộ,\nPhát dục, khó điều phục,\nTrói buộc, không ăn uống.\nVoi nhớ đến rừng voi.', en: 'The elephant called Dhanapalaka, his temples running with sap, and difficult to hold, does not eat a morsel when bound; the elephant longs for the elephant grove.' },
  { c: 'XXIII', n: 325, vi: 'Người ưa ngủ, ăn lớn\nNằm lăn lóc qua lại,\nChẳng khác heo no bụng,\nKẻ ngu nhập thai mãi.', en: 'If a man becomes fat and a great eater, if he is sleepy and rolls himself about, that fool, like a hog fed on wash, is born again and again.' },
  { c: 'XXIII', n: 326, vi: 'Trước tâm này buông lung,\nChạy theo ái, dục, lạc.\nNay Ta chánh chế ngự,\nNhư cầm móc điều voi.', en: 'This mind of mine went formerly wandering about as it liked, as it listed, as it pleased; but I shall now hold it in thoroughly, as the rider who holds the hook holds in the furious elephant.' },
  { c: 'XXIII', n: 327, vi: 'Hãy vui không phóng dật,\nKhéo phòng hộ tâm ý.\nKéo mình khỏi ác đạo,\nNhư voi bị sa lầy.', en: 'Be not thoughtless, watch your thoughts! Draw yourself out of the evil way, like an elephant sunk in mud.' },
  { c: 'XXIII', n: 328, vi: 'Nếu được bạn hiền trí\nĐáng sống chung, hạnh lành,\nNhiếp phục mọi hiểm nguy\nHoan hỷ sống chánh niệm.', en: 'If a man find a prudent companion who walks with him, is wise, and lives soberly, he may walk with him, overcoming all dangers, happy, but considerate.' },
  { c: 'XXIII', n: 329, vi: 'Không gặp bạn hiền trí.\nĐáng sống chung, hạnh lành\nNhư vua bỏ nước bại,\nHãy sống riêng cô độc,\nNhư voi sống rừng voi.', en: 'If a man find no prudent companion who walks with him, is wise, and lives soberly, let him walk alone, like a king who has left his conquered country behind,--like an elephant in the forest.' },
  { c: 'XXIII', n: 330, vi: 'Tốt hơn sống một mình\nKhông người ngu kết bạn.\nĐộc thân, không ác hạnh,\nSống vô tư vô lự,\nNhư voi sống rừng voi.', en: 'It is better to live alone, there is no companionship with a fool; let a man walk alone, let him commit no sin, with few wishes, like an elephant in the forest.' },
  { c: 'XXIII', n: 331, vi: 'Vui thay, bạn lúc cần !\nVui thay, sống biết đủ!\nVui thay, chết có đức !\nVui thay, mọi khổ đoạn.!', en: 'If an occasion arises, friends are pleasant; enjoyment is pleasant, whatever be the cause; a good work is pleasant in the hour of death; the giving up of all grief is pleasant.' },
  { c: 'XXIII', n: 332, vi: 'Vui thay, hiếu kính mẹ!\nVui thay, hiếu kính cha!\nVui thay, kính Sa môn!\nVui thay, kính Hiền Thánh!', en: 'Pleasant in the world is the state of a mother, pleasant the state of a father, pleasant the state of a Samana, pleasant the state of a Brahmana.' },
  { c: 'XXIII', n: 333, vi: 'Vui thay, già có giới !\nVui thay, tín an trú !\nVui thay, được trí tuệ,\nVui thay, ác không làm.', en: 'Pleasant is virtue lasting to old age, pleasant is a faith firmly rooted; pleasant is attainment of intelligence, pleasant is avoiding of sins.' },
  { c: 'XXIV', n: 334, vi: 'Người sống đời phóng dật,\nÁi tăng như giây leo.\nNhảy đời này đời khác,\nNhư vượn tham quả rừng.', en: 'The thirst of a thoughtless man grows like a creeper; he runs from life to life, like a monkey seeking fruit in the forest.' },
  { c: 'XXIV', n: 335, vi: 'Ai sống trong đời này,\nBị ái dục buộc ràng\nSầu khổ sẽ tăng trưởng,\nNhư cỏ bi gặp mưa.', en: 'Whomsoever this fierce thirst overcomes, full of poison, in this world, his sufferings increase like the abounding Birana grass.' },
  { c: 'XXIV', n: 336, vi: 'Ai sống trong đời này\nÁi dục được hàng phục\nSầu rơi khỏi người ấy\nNhư giọt nước lá sen.', en: 'He who overcomes this fierce thirst, difficult to be conquered in this world, sufferings fall off from him, like water-drops from a lotus leaf.' },
  { c: 'XXIV', n: 337, vi: 'Đây điều lành Ta dạy,\nCác Người tụ họp đây,\nHãy nhổ tận gốc ái\nNhư nhổ gốc cỏ Bi.\nChớ để ma phá hoại,\nNhư giòng nước cỏ lau.', en: 'This salutary word I tell you, `Do ye, as many as are here assembled, dig up the root of thirst, as he who wants the sweet-scented Usira root must dig up the Birana grass, that Mara (the tempter) may not crush you again and again, as the stream crushes the reeds.\'' },
  { c: 'XXIV', n: 338, vi: 'Như cây bị chặt đốn,\nGốc chưa hại vẫn bền\nÁi tùy miên chưa nhổ,\nKhổ này vẫn sanh hoài.', en: 'As a tree, even though it has been cut down, is firm so long as its root is safe, and grows again, thus, unless the feeders of thirst are destroyed, the pain (of life) will return again and again.' },
  { c: 'XXIV', n: 339, vi: 'Ba mươi sáu dòng ái,\nTrôi người đốn khả ái.\nCác tư tưởng tham ái.\nCuốn trôi người tà kiến.', en: 'He whose thirst running towards pleasure is exceeding strong in the thirty-six channels, the waves will carry away that misguided man, viz. his desires which are set on passion.' },
  { c: 'XXIV', n: 340, vi: 'Dòng ái dục chảy khắp,\nNhư giây leo mọc tràn,\nThấy giây leo vừa sanh,\nVới tuệ, hãy đoạn gốc.', en: 'The channels run everywhere, the creeper (of passion) stands sprouting; if you see the creeper springing up, cut its root by means of knowledge.' },
  { c: 'XXIV', n: 341, vi: 'Người đời nhớ ái dục,\nƯa thích các hỷ lạc.\nTuy mong cầu an lạc,\nChúng vẫn phải sanh già.', en: 'A creature\'s pleasures are extravagant and luxurious; sunk in lust and looking for pleasure, men undergo (again and again) birth and decay.' },
  { c: 'XXIV', n: 342, vi: 'Người bị ái buộc ràng,\nVùng vẫy và hoảng sợ,\nNhư thỏ bị sa lưới.\nHọ sanh ái trói buộc,\nChịu khổ đau dài dài.', en: 'Men, driven on by thirst, run about like a snared hare; held in fetters and bonds, they undergo pain for a long time, again and again.' },
  { c: 'XXIV', n: 343, vi: 'Người bị ái buộc ràng,\nVùng vẫy và hoảng sợ,\nNhư thỏ bị sa lưới.\nDo vậy vị Tỷ-kheo,\nMong cầu mình ly tham\nNên nhiếp phục ái dục.', en: 'Men, driven on by thirst, run about like a snared hare; let therefore the mendicant drive out thirst, by striving after passionlessness for himself.' },
  { c: 'XXIV', n: 344, vi: 'Lìa rừng lại hướng rừng\nThoát rừng chạy theo rừng.\nNên xem người như vậy,\nĐược thoát khỏi buộc ràng.\nLại chạy theo ràng buộc.', en: 'He who having got rid of the forest (of lust) (i.e. after having reached Nirvana) gives himself over to forest-life (i.e. to lust), and who, when removed from the forest (i.e. from lust), runs to the forest (i.e. to lust), look at that man! though free, he runs into bondage.' },
  { c: 'XXIV', n: 345, vi: 'Sắt, cây, gai trói buộc\nNgười trí xem chưa bền.\nTham châu báu, trang sức\nTham vọng vợ và con.', en: 'Wise people do not call that a strong fetter which is made of iron, wood, or hemp; far stronger is the care for precious stones and rings, for sons and a wife.' },
  { c: 'XXIV', n: 346, vi: 'Người có trí nói rằng:\nTrói buộc này thật bền.\nRì kéo xuống, mần xuống,\nNhưng thật sự khó thoát.\nNgười trí cắt trừ nó,\nBỏ dục lạc, không màng.', en: 'That fetter wise people call strong which drags down, yields, but is difficult to undo; after having cut this at last, people leave the world, free from cares, and leaving desires and pleasures behind.' },
  { c: 'XXIV', n: 347, vi: 'Người đắm say ái dục\nTự lao mình xuống dòng\nNhư nhện sa lưới dệt.\nNgười trí cắt trừ nó,\nBỏ mọi khổ, không màng.', en: 'Those who are slaves to passions, run down with the stream (of desires), as a spider runs down the web which he has made himself; when they have cut this, at last, wise people leave the world free from cares, leaving all affection behind.' },
  { c: 'XXIV', n: 348, vi: 'Bỏ quá, hiện, vị lai,\nĐến bờ kia cuộc đời,\nÝ giải thoát tất cả,\nChớ vướng lại sanh già.', en: 'Give up what is before, give up what is behind, give up what is in the middle, when thou goest to the other shore of existence; if thy mind is altogether free, thou wilt not again enter into birth and decay.' },
  { c: 'XXIV', n: 349, vi: 'Người tà ý nhiếp phục,\nTham sắc bén nhìn tịnh,\nNgười ấy ái tăng trưởng,\nLàm giây trói mình chặt.', en: 'If a man is tossed about by doubts, full of strong passions, and yearning only for what is delightful, his thirst will grow more and more, and he will indeed make his fetters strong.' },
  { c: 'XXIV', n: 350, vi: 'Ai vui an tịnh ý,\nQuán bất tịnh, thường niệm,\nNgười ấy sẽ diệt ái,\nCắt đứt Ma trói buộc.', en: 'If a man delights in quieting doubts, and, always reflecting, dwells on what is not delightful (the impurity of the body, etc.), he certainly will remove, nay, he will cut the fetter of Mara.' },
  { c: 'XXIV', n: 351, vi: 'Ai tới đích, không sợ,\nLy ái, không nhiễm ô\nNhổ mũi tên sanh tử,\nThân này thân cuối cùng.', en: 'He who has reached the consummation, who does not tremble, who is without thirst and without sin, he has broken all the thorns of life: this will be his last body.' },
  { c: 'XXIV', n: 352, vi: 'Ái lìa, không chấp thủ.\nCú pháp khéo biện tài,\nThấu suốt từ vô ngại,\nHiểu thứ lớp trước sau.\nThân này thân cuối cùng\nVị như vậy được gọi,\nBậc Đại trí, Đại nhân.', en: 'He who is without thirst and without affection, who understands the words and their interpretation, who knows the order of letters (those which are before and which are after), he has received his last body, he is called the great sage, the great man.' },
  { c: 'XXIV', n: 353, vi: 'Ta hàng phục tất cả,\nTa rõ biết tất cả,\nKhông bị nhiễm pháp nào.\nTa từ bỏ tất cả\nÁi diệt, tự giải thoát.\nĐã tự mình thắng trí,\nTa gọi ai thầy ta ?', en: '`I have conquered all, I know all, in all conditions of life I am free from taint; I have left all, and through the destruction of thirst I am free; having learnt myself, whom shall I teach?\'' },
  { c: 'XXIV', n: 354, vi: 'Pháp thí thắng mọi thí !\nPháp vị thắng mọi vị !\nPháp hỷ thắng mọi hỷ !\nÁi diệt dứt mọi khổ !', en: 'The gift of the law exceeds all gifts; the sweetness of the law exceeds all sweetness; the delight in the law exceeds all delights; the extinction of thirst overcomes all pain.' },
  { c: 'XXIV', n: 355, vi: 'Tài sản hại người ngu.\nKhông người tìm bờ kia\nKẻ ngu vì tham giàu,\nHại mình và hại người.', en: 'Pleasures destroy the foolish, if they look not for the other shore; the foolish by his thirst for pleasures destroys himself, as if he were his own enemy.' },
  { c: 'XXIV', n: 356, vi: 'Cỏ làm hại ruộng vườn,\nTham làm hại người đời,\nBố thí người ly tham,\nDo vậy được quả lớn.', en: 'The fields are damaged by weeds, mankind is damaged by passion: therefore a gift bestowed on the passionless brings great reward.' },
  { c: 'XXIV', n: 357, vi: 'Cỏ làm hại ruộng vườn,\nSân làm hại người đời.\nBố thí người ly sân,\nDo vậy được quả lớn.', en: 'The fields are damaged by weeds, mankind is damaged by hatred: therefore a gift bestowed on those who do not hate brings great reward.' },
  { c: 'XXIV', n: 358, vi: 'Cỏ làm hại ruộng vườn,\nSi làm hại người đời,\nBố thí người ly si,\nDo vậy được quả lớn.', en: 'The fields are damaged by weeds, mankind is damaged by vanity: therefore a gift bestowed on those who are free from vanity brings great reward.' },
  { c: 'XXIV', n: 359, vi: 'Cỏ làm hại ruộng vườn,\nDục làm hại người đời.\nBố thí người ly dục,\nDo vậy được quả lớn.', en: 'The fields are damaged by weeds, mankind is damaged by lust: therefore a gift bestowed on those who are free from lust brings great reward.' },
  { c: 'XXV', n: 360, vi: 'Lành thay, phòng hộ mắt,\nLành thay, phòng hộ tai,\nLành thay, phòng hộ mũi,\nLành thay, phòng hộ lưỡi.', en: 'Restraint in the eye is good, good is restraint in the ear, in the nose restraint is good, good is restraint in the tongue.' },
  { c: 'XXV', n: 361, vi: 'Lành thay, phòng hộ thân,\nLành thay, phòng hộ lời,\nLành thay, phòng hộ ý.\nLành thay, phòng tất cả.\nTỷ-kheo phòng tất cả,\nThoát được mọi khổ đau.', en: 'In the body restraint is good, good is restraint in speech, in thought restraint is good, good is restraint in all things. A Bhikshu, restrained in all things, is freed from all pain.' },
  { c: 'XXV', n: 362, vi: 'Người chế ngự tay chân,\nChế ngự lời và đầu,\nVui thích nội thiền định.\nĐộc thân, biết vừa đủ,\nThật xứng gọi Tỷ-kheo.', en: 'He who controls his hand, he who controls his feet, he who controls his speech, he who is well controlled, he who delights inwardly, who is collected, who is solitary and content, him they call Bhikshu.' },
  { c: 'XXV', n: 363, vi: 'Tỷ-kheo chế ngự miệng,\nVừa lời, không cống cao,\nKhi trình bày pháp nghĩa,\nLời lẽ dịu ngọt ngào.', en: 'The Bhikshu who controls his mouth, who speaks wisely and calmly, who teaches the meaning and the law, his word is sweet.' },
  { c: 'XXV', n: 364, vi: 'Vị tỷ-kheo thích pháp,\nMến pháp, suy tư Pháp.\nTâm tư niệm chánh Pháp,\nKhông rời bỏ chánh Pháp.', en: 'He who dwells in the law, delights in the law, meditates on the law, follows the law, that Bhikshu will never fall away from the true law.' },
  { c: 'XXV', n: 365, vi: 'Không khinh điều mình được,\nKhông ganh người khác được\nTỷ-kheo ganh tị người,\nKhông sao chứng thiền định.', en: 'Let him not despise what he has received, nor ever envy others: a mendicant who envies others does not obtain peace of mind.' },
  { c: 'XXV', n: 366, vi: 'Tỷ-kheo dầu được ít,\nKhông khinh điều mình được,\nSống thanh tịnh không nhác,\nChư Thiên khen vị này.', en: 'A Bhikshu who, though he receives little, does not despise what he has received, even the gods will praise him, if his life is pure, and if he is not slothful.' },
  { c: 'XXV', n: 367, vi: 'Hoàn toàn, đối danh sắc,\nKhông chấp ta, của ta.\nKhông chấp, không sầu não.\nThật xứng danh Tỷ-kheo.', en: 'He who never identifies himself with name and form, and does not grieve over what is no more, he indeed is called a Bhikshu.' },
  { c: 'XXV', n: 368, vi: 'Tỷ-kheo trú từ bi,\nTín thành giáo pháp Phật,\nChứng cảnh giới tịch tịnh.\nCác hành an tịnh lạc.', en: 'The Bhikshu who acts with kindness, who is calm in the doctrine of Buddha, will reach the quiet place (Nirvana), cessation of natural desires, and happiness.' },
  { c: 'XXV', n: 369, vi: 'Tỷ-kheo, tát thuyền này,\nThuyền không, nhẹ đi mau.\nTrừ tham, diệt sân hận,\nTất chứng đạt Niết -bàn.', en: 'O Bhikshu, empty this boat! if emptied, it will go quickly; having cut off passion and hatred thou wilt go to Nirvana.' },
  { c: 'XXV', n: 370, vi: 'Đoạn năm, từ bỏ năm\nTu tập năm tối thượng\nTỷ-kheo vượt năm ái\nXứng danh vượt bộc lưu.', en: 'Cut off the five (senses), leave the five, rise above the five. A Bhikshu, who has escaped from the five fetters, he is called Oghatinna, `saved from the flood.\'' },
  { c: 'XXV', n: 371, vi: 'Tỷ-kheo, hãy tu Thiền,\nChớ buông lung phóng dật,\nTâm chớ đắm say dục,\nPhóng dật, nuốt sắt nóng\nBị đốt, chớ than khổ', en: 'Meditate, O Bhikshu, and be not heedless! Do not direct thy thought to what gives pleasure that thou mayest not for thy heedlessness have to swallow the iron ball (in hell), and that thou mayest not cry out when burning, `This is pain.\'' },
  { c: 'XXV', n: 372, vi: 'Không trí tuệ, không thiền,\nKhông thiền, không trí tuệ.\nNgười có thiền có tuệ,\nNhất định gần Niết-bàn.', en: 'Without knowledge there is no meditation, without meditation there is no knowledge: he who has knowledge and meditation is near unto Nirvana.' },
  { c: 'XXV', n: 373, vi: 'Bước vào ngôi nhà trống,\nTỷ-kheo tâm an tịnh,\nThọ hưởng vui siêu nhân\nTịnh quán theo Chánh pháp.', en: 'A Bhikshu who has entered his empty house, and whose mind is tranquil, feels a more than human delight when he sees the law clearly.' },
  { c: 'XXV', n: 374, vi: 'Người luôn luôn chánh niệm,\nSự sanh diệt các uẩn,\nĐược hoan hỷ, hân hoan,\nChỉ bậc bất tử biết.', en: 'As soon as he has considered the origin and destruction of the elements (khandha) of the body, he finds happiness and joy which belong to those who know the immortal (Nirvana).' },
  { c: 'XXV', n: 375, vi: 'Đây Tỷ-kheo có trí,\nTụ tập pháp căn bản\nHộ căn, biết vừa đủ,\nGìn giữ căn bản giới,\nThường gần gũi bạn lành,\nSống thanh tịnh tinh cần.', en: 'And this is the beginning here for a wise Bhikshu: watchfulness over the senses, contentedness, restraint under the law; keep noble friends whose life is pure, and who are not slothful.' },
  { c: 'XXV', n: 376, vi: 'Giao thiệp khéo thân thiện,\nCử chỉ mực đoan trang.\nDo vậy hưởng vui nhiều,\nSẽ dứt mọi khổ đau.', en: 'Let him live in charity, let him be perfect in his duties; then in the fulness of delight he will make an end of suffering.' },
  { c: 'XXV', n: 377, vi: 'Như hoa vassikà,\nQuăng bỏ cánh úa tàn,\nCũng vậy vị Tỷ-kheo,\nHãy giải thoát tham sân.', en: 'As the Vassika plant sheds its withered flowers, men should shed passion and hatred, O ye Bhikshus!' },
  { c: 'XXV', n: 378, vi: 'Thân tịnh, lời an tịnh,\nAn tịnh, khéo Thiền tịnh\nTỷ-kheo bỏ thế vật,\nXứng danh bậc tịch tịnh.', en: 'The Bhikshu whose body and tongue and mind are quieted, who is collected, and has rejected the baits of the world, he is called quiet.' },
  { c: 'XXV', n: 379, vi: 'Tự mình chỉ trích mình,\nTự mình dò xét mình,\nTỷ-kheo tự phòng hộ\nChánh niệm, trú an lạc.', en: 'Rouse thyself by thyself, examine thyself by thyself, thus self-protected and attentive wilt thou live happily, O Bhikshu!' },
  { c: 'XXV', n: 380, vi: 'Tự mình y chỉ mình,\nTự mình đi đến mình,\nVậy hãy tự điều phục,\nNhư khách buôn ngựa hiền.', en: 'For self is the lord of self, self is the refuge of self; therefore curb thyself as the merchant curbs a good horse.' },
  { c: 'XXV', n: 381, vi: 'Tỷ-kheo nhiều hân hoan,\nTịnh tín giáo pháp Phật,\nChứng cảnh giới tịch tịnh,\nCác hạnh an tịnh lạc.', en: 'The Bhikshu, full of delight, who is calm in the doctrine of Buddha will reach the quiet place (Nirvana), cessation of natural desires, and happiness.' },
  { c: 'XXV', n: 382, vi: 'Tỷ kheo tuy tuổi nhỏ\nSiêng tu giáo pháp Phật,\nSoi sáng thế gian này,\nNhư trăng thoát khỏi mây.', en: 'He who, even as a young Bhikshu, applies himself to the doctrine of Buddha, brightens up this world, like the moon when free from clouds.' },
  { c: 'XXVI', n: 383, vi: 'Hỡi này Bà là môn,\nHãy tinh tấn đoạn dòng,\nTừ bỏ các dục lạc,\nBiết được hành đoạn diệt,\nNgười là bậc vô vi.', en: 'Stop the stream valiantly, drive away the desires, O Brahmana! When you have understood the destruction of all that was made, you will understand that which was not made.' },
  { c: 'XXVI', n: 384, vi: 'Nhờ thường trú hai pháp\nĐến được bờ bên kia.\nBà-la-môn có trí,\nMọi kiết sử dứt sạch.', en: 'If the Brahmana has reached the other shore in both laws (in restraint and contemplation), all bonds vanish from him who has obtained knowledge.' },
  { c: 'XXVI', n: 385, vi: 'Không bờ này, bờ kia\nCả hai bờ không có,\nLìa khổ, không trói buộc\nTa gọi Bà-la-môn.', en: 'He for whom there is neither this nor that shore, nor both, him, the fearless and unshackled, I call indeed a Brahmana.' },
  { c: 'XXVI', n: 386, vi: 'Tu Thiền, trú ly trần\nPhận sự xong, vô lậu,\nĐạt được đích tối thượng,\nTa gọi Bà-la-môn.', en: 'He who is thoughtful, blameless, settled, dutiful, without passions, and who has attained the highest end, him I call indeed a Brahmana.' },
  { c: 'XXVI', n: 387, vi: 'Mặt trời sáng ban ngàn,\nMặt trăng sáng ban đêm.\nKhí giới sáng Sát-lỵ,\nThiền định sáng Phạm chí.\nCòn hào quang đức Phật,\nChói sáng cả ngày đêm.', en: 'The sun is bright by day, the moon shines by night, the warrior is bright in his armour, the Brahmana is bright in his meditation; but Buddha, the Awakened, is bright with splendour day and night.' },
  { c: 'XXVI', n: 388, vi: 'Dứt ác gọi Phạm chí,\nTịnh hạnh gọi Sa môn,\nTự mình xuất cấu uế,\nNên gọi bậc xuất gia.', en: 'Because a man is rid of evil, therefore he is called Brahmana; because he walks quietly, therefore he is called Samana; because he has sent away his own impurities, therefore he is called Pravragita (Pabbagita, a pilgrim).' },
  { c: 'XXVI', n: 389, vi: 'Chớ có đập Phạm chí !\nPhạm chí chớ đập lại !\nXấu thay đập Phạm chí\nĐập trả lại, xấu hơn.', en: 'No one should attack a Brahmana, but no Brahmana (if attacked) should let himself fly at his aggressor! Woe to him who strikes a Brahmana, more woe to him who flies at his aggressor!' },
  { c: 'XXVI', n: 390, vi: 'Đối vị Bà-la-môn,\nĐây không lợi ích nhỏ.\nKhi ý không ái luyến,\nTâm hại được chận đứng,\nChỉ khi ấy khổ diệt.', en: 'It advantages a Brahmana not a little if he holds his mind back from the pleasures of life; when all wish to injure has vanished, pain will cease.' },
  { c: 'XXVI', n: 391, vi: 'Với người thân miệng ý,\nKhông làm các ác hạnh\nBa nghiệp được phòng hộ,\nTa gọi Bà-la-môn.', en: 'Him I call indeed a Brahmana who does not offend by body, word, or thought, and is controlled on these three points.' },
  { c: 'XXVI', n: 392, vi: 'Từ ai, biết chánh pháp\nBậc Chánh Giác thuyết giảng,\nHãy kính lễ vị ấy,\nNhư phạm chí thờ lửa.', en: 'After a man has once understood the law as taught by the Well-awakened (Buddha), let him worship it carefully, as the Brahmana worships the sacrificial fire.' },
  { c: 'XXVI', n: 393, vi: 'Được gọi Bà-la-môn,\nKhông vì đầu bện tóc,\nKhông chủng tộc, thọ sanh,\nAi thật chân, chánh, tịnh,\nMới gọi Bà-la-môn.', en: 'A man does not become a Brahmana by his platted hair, by his family, or by birth; in whom there is truth and righteousness, he is blessed, he is a Brahmana.' },
  { c: 'XXVI', n: 394, vi: 'Kẻ ngu, có ích gì\nBện tóc với da dê,\nNội tâm toàn phiền não,\nNgoài mặt đánh bóng suông.', en: 'What is the use of platted hair, O fool! what of the raiment of goat-skins? Within thee there is ravening, but the outside thou makest clean.' },
  { c: 'XXVI', n: 395, vi: 'Người mặc áo đống rác,\nGầy ốm, lộ mạch gân,\nĐộc thân thiền trong rừng.\nTa gọi Bà-la-môn.', en: 'The man who wears dirty raiments, who is emaciated and covered with veins, who lives alone in the forest, and meditates, him I call indeed a Brahmana.' },
  { c: 'XXVI', n: 396, vi: 'Ta không gọi Phạm Chí,\nVì chỗ sanh, mẹ sanh.\nChỉ được gọi tên suông\nNếu tâm còn phiền não.\nKhông phiền não, chấp trước\nTa gọi Bà-la-môn.', en: 'I do not call a man a Brahmana because of his origin or of his mother. He is indeed arrogant, and he is wealthy: but the poor, who is free from all attachments, him I call indeed a Brahmana.' },
  { c: 'XXVI', n: 397, vi: 'Đoạn hết các kiết sử,\nKhông còn gì lo sợ\nKhông đắm trước buộc ràng\nTa gọi Bà-la-môn', en: 'Him I call indeed a Brahmana who has cut all fetters, who never trembles, is independent and unshackled.' },
  { c: 'XXVI', n: 398, vi: 'Bỏ đai da, bỏ cương\nBỏ dây, đồ sở thuộc,\nBỏ then chốt, sáng suốt,\nTa gọi Bà-la-môn.', en: 'Him I call indeed a Brahmana who has cut the strap and the thong, the chain with all that pertains to it, who has burst the bar, and is awakened.' },
  { c: 'XXVI', n: 399, vi: 'Không ác ý, nhẫn chịu,\nPhỉ báng, đánh, phạt hình,\nLấy nhẫn làm quân lực,\nTa gọi Bà-la-môn.', en: 'Him I call indeed a Brahmana who, though he has committed no offence, endures reproach, bonds, and stripes, who has endurance for his force, and strength for his army.' },
  { c: 'XXVI', n: 400, vi: 'Không hận, hết bổn phận,\nTrì giới, không tham ái,\nNhiếp phục, thân cuối cùng,\nTa gọi Bà-la-môn.', en: 'Him I call indeed a Brahmana who is free from anger, dutiful, virtuous, without appetite, who is subdued, and has received his last body.' },
  { c: 'XXVI', n: 401, vi: 'Như nước trên lá sen,\nNhư hột cải đầu kim,\nNgười không nhiễm ái dục,\nTa gọi Bà-la-môn.', en: 'Him I call indeed a Brahmana who does not cling to pleasures, like water on a lotus leaf, like a mustard seed on the point of a needle.' },
  { c: 'XXVI', n: 402, vi: 'Ai tự trên đời này,\nGiác khổ, diệt trừ khổ,\nBỏ gánh nặng, giải thoát,\nTa gọi Bà-la-môn..', en: 'Him I call indeed a Brahmana who, even here, knows the end of his suffering, has put down his burden, and is unshackled.' },
  { c: 'XXVI', n: 403, vi: 'Người trí tuệ sâu xa,\nKhéo biết đạo, phi đạo\nChứng đạt đích vô thượng,\nTa gọi Bà-la-môn.', en: 'Him I call indeed a Brahmana whose knowledge is deep, who possesses wisdom, who knows the right way and the wrong, and has attained the highest end.' },
  { c: 'XXVI', n: 404, vi: 'Không liên hệ cả hai,\nXuất gia và thế tục,\nSống độc thân, ít dục,\nTa gọi Bà-la-môn. ', en: 'Him I call indeed a Brahmana who keeps aloof both from laymen and from mendicants, who frequents no houses, and has but few desires.' },
  { c: 'XXVI', n: 405, vi: 'Bỏ trượng, đối chúng sanh,\nYếu kém hay kiên cường,\nKhông giết, không bảo giết,\nTa gọi Bà-la-môn.', en: 'Him I call indeed a Brahmana who finds no fault with other beings, whether feeble or strong, and does not kill nor cause slaughter.' },
  { c: 'XXVI', n: 406, vi: 'Thân thiện giữa thù địch\nÔn hòa giữa hung hăng.\nKhông nhiễm, giữa nhiễm trước,\nTa gọi Bà-la-môn.', en: 'Him I call indeed a Brahmana who is tolerant with the intolerant, mild with fault-finders, and free from passion among the passionate.' },
  { c: 'XXVI', n: 407, vi: 'Người bỏ rơi tham sân,\nKhông mạn không ganh tị,\nNhư hột cải đầu kim,\nTa gọi Bà-la-môn.', en: 'Him I call indeed a Brahmana from whom anger and hatred, pride and envy have dropt like a mustard seed from the point of a needle.' },
  { c: 'XXVI', n: 408, vi: 'Nói lên lời ôn hòa,\nLợi ích và chân thật,\nKhông mất lòng một ai,\nTa gọi Bà-la-môn.', en: 'Him I call indeed a Brahmana who utters true speech, instructive and free from harshness, so that he offend no one.' },
  { c: 'XXVI', n: 409, vi: 'Ở đời, vật dài, ngắn,\nNhỏ, lớn, đẹp hay xấu\nPhàm không cho không lấy,\nTa gọi Bà-la-môn.', en: 'Him I call indeed a Brahmana who takes nothing in the world that is not given him, be it long or short, small or large, good or bad.' },
  { c: 'XXVI', n: 410, vi: 'Người không có hy cầu,\nĐời này và đời sau,\nKhông hy cầu, giải thoát,\nTa gọi Bà-la-môn.', en: 'Him I call indeed a Brahmana who fosters no desires for this world or for the next, has no inclinations, and is unshackled.' },
  { c: 'XXVI', n: 411, vi: 'Người không còn tham ái,\nCó trí, không nghi hoặc,\nThể nhập vào bất tử,\nTa gọi Bà-la-môn.', en: 'Him I call indeed a Brahmana who has no interests, and when he has understood (the truth), does not say How, how? and who has reached the depth of the Immortal.' },
  { c: 'XXVI', n: 412, vi: 'Người sống ở đời này\nKhông nhiễm cả thiện ác,\nKhông sầu, sạch không bụi\nTa gọi Bà-la-môn.', en: 'Him I call indeed a Brahmana who in this world is above good and evil, above the bondage of both, free from grief from sin, and from impurity.' },
  { c: 'XXVI', n: 413, vi: 'Như trăng, sạch không uế\nSáng trong và tịnh lặng,\nHữu ái, được đoạn tận,\nTa gọi Bà-la-môn.', en: 'Him I call indeed a Brahmana who is bright like the moon, pure, serene, undisturbed, and in whom all gaiety is extinct.' },
  { c: 'XXVI', n: 414, vi: 'Vượt đường nguy hiểm này,\nNhiếp phục luân hồi, si,\nĐến bờ kia thiền định\nKhông dục ái, không nghi,\nKhông chấp trước, tịch tịnh,\nTa gọi Bà-la-môn.', en: 'Him I call indeed a Brahmana who has traversed this miry road, the impassable world and its vanity, who has gone through, and reached the other shore, is thoughtful, guileless, free from doubts, free from attachment, and content.' },
  { c: 'XXVI', n: 415, vi: 'Ai ở đời, đoạn dục,\nBỏ nhà, sống xuất gia,\nDục hữu được đoạn tận,\nTa gọi Bà-la-môn.', en: 'Him I call indeed a Brahmana who in this world, leaving all desires, travels about without a home, and in whom all concupiscence is extinct.' },
  { c: 'XXVI', n: 416, vi: 'Ai ở đời đoạn ái\nBỏ nhà, sống xuất gia,\nÁi hữu được đoạn tận,\nTa gọi Bà-la-môn.', en: 'Him I call indeed a Brahmana who, leaving all longings, travels about without a home, and in whom all covetousness is extinct.' },
  { c: 'XXVI', n: 417, vi: 'Bỏ trói buộc loài Người,\nVượt trói buộc cõi trời.\nGiải thoát mọi buộc ràng,\nTa gọi Bà-la-môn.', en: 'Him I call indeed a Brahmana who, after leaving all bondage to men, has risen above all bondage to the gods, and is free from all and every bondage.' },
  { c: 'XXVI', n: 418, vi: 'Bỏ điều ưa, điều ghét,\nMát lạnh, diệt sanh y\nBậc anh hùng chiến thắng,\nNhiếp phục mọi thế giới,\nTa gọi Bà-la-môn.', en: 'Him I call indeed a Brahmana who has left what gives pleasure and what gives pain, who is cold, and free from all germs (of renewed life), the hero who has conquered all the worlds.' },
  { c: 'XXVI', n: 419, vi: 'Ai hiểu rõ hoàn toàn\nSanh tử các chúng sanh,\nKhông nhiễm, khéo vượt qua,\nSáng suốt chân giác ngộ,\nTa gọi Bà-la-môn.', en: 'Him I call indeed a Brahmana who knows the destruction and the return of beings everywhere, who is free from bondage, welfaring (Sugata), and awakened (Buddha).' },
  { c: 'XXVI', n: 420, vi: 'Với ai, loài Trời, Người,\nCùng với Càn-thát-bà,\nKhông biết chỗ thọ sanh,\nLậu tận bậc La-hán.\nTa gọi Bà-la-môn.', en: 'Him I call indeed a Brahmana whose path the gods do not know, nor spirits (Gandharvas), nor men, whose passions are extinct, and who is an Arhat (venerable).' },
  { c: 'XXVI', n: 421, vi: 'Ai quá, hiện, vị lai\nKhông một sở hữu gì,\nKhông sở hữu không nắm,\nTa gọi Bà-la-môn.', en: 'Him I call indeed a Brahmana who calls nothing his own, whether it be before, behind, or between, who is poor, and free from the love of the world.' },
  { c: 'XXVI', n: 422, vi: 'Bậc trâu chúa, thù thắng\nBậc anh hùng, đại sĩ,\nBậc chiến thắng, không nhiễm,\nBậc tẩy sạch, giác ngộ,\nTa gọi Bà-la-môn.', en: 'Him I call indeed a Brahmana, the manly, the noble, the hero, the great sage, the conqueror, the impassible, the accomplished, the awakened.' },
  { c: 'XXVI', n: 423, vi: 'Ai biết được đời trước,\nThấy thiên giới, đọa xứ,\nĐạt được sanh diệt tận\nThắng trí, tự viên thành\nBậc Mâu-ni đạo sĩ.\nViên mãn mọi thành tựu\nTa gọi Bà-la-môn.', en: 'Him I call indeed a Brahmana who knows his former abodes, who sees heaven and hell, has reached the end of births, is perfect in knowledge, a sage, and whose perfections are all perfect.' }
  ];

  var activeChapter = 'I';
  var expanded = {};

  function escapeHtml(s) {
    return (s || '').replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  async function loadLastChapter() {
    try {
      var r = await window.storage.get(STORAGE_KEY, false);
      if (r && r.value && CHAPTERS.some(function (ch) { return ch.id === r.value; })) return r.value;
    } catch (e) {}
    return 'I';
  }

  async function saveLastChapter(id) {
    try { await window.storage.set(STORAGE_KEY, id, false); } catch (e) {}
  }

  function selectChapter(id) {
    activeChapter = id;
    expanded = {};
    saveLastChapter(id);
    render();
  }

  function toggleVerse(n) {
    expanded[n] = !expanded[n];
    render();
  }

  function render() {
    var app = document.getElementById('app');
    
    var chapterSelect = '<div class="chapter-select-wrapper"><select id="chapter-select" class="chapter-dropdown">';
    CHAPTERS.forEach(function (ch) {
      var isSelected = ch.id === activeChapter ? ' selected' : '';
      chapterSelect += '<option value="' + ch.id + '"' + isSelected + '>' + escapeHtml(ch.title) + '</option>';
    });
    chapterSelect += '</select></div>';

    var chapterMeta = CHAPTERS.filter(function (ch) { return ch.id === activeChapter; })[0];
    var header = '<div class="chapter-title">' + escapeHtml(chapterMeta.title) + '</div>' +
      '<div class="chapter-range">' + escapeHtml(chapterMeta.range) + '</div>';

    var verses = VERSES.filter(function (v) { return v.c === activeChapter; });
    var cards = '';
    
    if (verses.length === 0) {
      cards = '<div class="verse-card" style="text-align:center; color: var(--muted);"><p>Chưa có dữ liệu cho phẩm này.</p></div>';
    } else {
      cards = verses.map(function (v) {
        var isOpen = !!expanded[v.n];
        return '<div class="verse-card">' +
          '<div class="verse-num">câu ' + v.n + '</div>' +
          '<p class="verse-vi">' + escapeHtml(v.vi) + '</p>' +
          '<button class="verse-toggle" data-verse="' + v.n + '">' + (isOpen ? 'Ẩn tiếng Anh' : 'Xem tiếng Anh') + '</button>' +
          (isOpen ? '<div class="verse-en">' + escapeHtml(v.en) + '</div>' : '') +
          '</div>';
      }).join('');
    }

    app.innerHTML = chapterSelect + header + cards;

    document.getElementById('chapter-select').addEventListener('change', function(e) {
      selectChapter(e.target.value);
    });

    Array.prototype.forEach.call(app.querySelectorAll('.verse-toggle'), function (btn) {
      btn.addEventListener('click', function () { toggleVerse(parseInt(btn.getAttribute('data-verse'), 10)); });
    });
  }

  async function init() {
    activeChapter = await loadLastChapter();
    render();
  }
  
  init();
})();
</script>
</body>
</html>
